<!doctype html>
<meta charset="utf-8">
<title>BuildHUD — handoff cockpit</title>
<!-- Zero-dep cockpit for the durable handoff hub. Drag one agent onto another to send a handoff.
     Offline agents still receive it (durable inbox) and act on next poll. React Flow is the later
     upgrade (docs G2); vanilla DnD keeps the prototype dependency-free. Hub re-reads this file per
     GET / — edit + reload, no hub restart. -->
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --amber:#d29922; --blue:#58a6ff; --red:#f85149; --grey:#6e7681; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:14px; padding:9px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; } header h1 span { color:var(--dim); font-weight:400; }
  #summary { display:flex; gap:7px; align-items:center; }
  .cnt { font-size:12px; border:1px solid var(--line); background:#0d1117; border-radius:999px; padding:2px 10px; cursor:pointer; color:var(--dim); user-select:none; }
  .cnt b { color:var(--txt); } .cnt.on { box-shadow:0 0 0 1px currentColor inset; }
  .cnt.submitted{color:var(--grey)} .cnt.awaiting_approval{color:var(--amber)} .cnt.running{color:var(--blue)}
  .cnt.completed{color:var(--green)} .cnt.failed{color:var(--red)} .cnt.online{color:var(--green)}
  #add { margin-left:auto; display:flex; gap:6px; align-items:center; }
  #add input { background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:5px 8px; font:inherit; width:150px; }
  .btn { font-size:12px; border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:7px; padding:5px 11px; cursor:pointer; }
  #conn { font-size:12px; color:var(--dim); min-width:74px; text-align:right; }
  .wrap { display:grid; grid-template-columns:1fr 380px; height:calc(100vh - 50px); }
  #canvas { position:relative; overflow:auto; }
  svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  svg .flow { stroke-dasharray:7 6; animation:dash .7s linear infinite; }
  @keyframes dash { to { stroke-dashoffset:-13; } }
  .node { position:absolute; width:206px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; cursor:grab; user-select:none; transition:border-color .15s, box-shadow .15s; }
  .node:hover { border-color:var(--blue); } .node.drop { border-color:var(--green); box-shadow:0 0 0 2px var(--green) inset; }
  .node.busy { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue) inset; animation:busy 1.1s ease-in-out infinite; }
  @keyframes busy { 50% { box-shadow:0 0 14px -2px var(--blue), 0 0 0 1px var(--blue) inset; } }
  /* Wave A — typed wiring ports (React Flow handle concept, vanilla). out(right)→in(left) drag draws an edge. */
  .port { position:absolute; width:13px; height:13px; border-radius:50%; background:#0d1117; border:2px solid var(--blue);
          top:50%; transform:translateY(-50%); cursor:crosshair; z-index:3; transition:box-shadow .1s, background .1s; }
  .port.in { left:-7px; } .port.out { right:-7px; }
  .port::after { content:attr(data-t); position:absolute; bottom:15px; left:50%; transform:translateX(-50%); font-size:9px;
                 color:var(--dim); white-space:nowrap; opacity:0; pointer-events:none; }
  .port:hover::after { opacity:1; } .port:hover { background:var(--blue); }
  .port.in.valid { border-color:var(--green); background:var(--green); box-shadow:0 0 0 4px rgba(63,185,80,.22); }
  .port.in.invalid { border-color:var(--red); background:var(--red); box-shadow:0 0 0 4px rgba(248,81,73,.22); }
  .node.dragging { z-index:10; opacity:.92; cursor:grabbing; box-shadow:0 6px 20px -6px rgba(0,0,0,.6); }
  body.wiring .node { cursor:crosshair; } body.wiring { cursor:crosshair; }
  svg .hit { pointer-events:stroke; stroke:transparent; stroke-width:15; fill:none; cursor:pointer; }
  svg .tw { stroke-dasharray:6 5; opacity:.95; }
  .node .name { font-weight:600; display:flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--grey); flex:none; }
  .dot.on { background:var(--green); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(63,185,80,.6);} 50%{ box-shadow:0 0 0 5px rgba(63,185,80,0);} }
  .node .co { color:var(--dim); font-size:11px; margin:1px 0 8px; } .node .row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); }
  .pill { border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:999px; font-size:11px; padding:2px 9px; cursor:pointer; }
  .pill.auto { border-color:var(--amber); color:var(--amber); } .pill.approval { border-color:var(--blue); color:var(--blue); }
  .badge { margin-left:auto; background:#0d1117; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; }
  .hint { padding:14px 16px; color:var(--dim); font-size:12px; }
  #panel { border-left:1px solid var(--line); overflow:auto; padding:12px; }
  #panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:6px 2px; display:flex; }
  #panel h2 .clear { margin-left:auto; cursor:pointer; color:var(--blue); text-transform:none; letter-spacing:0; }
  .h { border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px; background:var(--panel); cursor:pointer; }
  .h .top { display:flex; align-items:center; gap:8px; font-size:12px; }
  .h .who { color:var(--dim); } .h .who b { color:var(--txt); } .h .time { margin-left:auto; color:var(--dim); font-size:11px; }
  .st { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid; }
  .st.submitted{color:var(--grey);border-color:var(--grey)} .st.awaiting_approval{color:var(--amber);border-color:var(--amber)}
  .st.approved,.st.running{color:var(--blue);border-color:var(--blue)} .st.completed{color:var(--green);border-color:var(--green)}
  .st.failed,.st.rejected{color:var(--red);border-color:var(--red)}
  .h .body { font-size:12px; color:var(--dim); margin-top:6px; white-space:pre-wrap; max-height:120px; overflow:auto; }
  .h.open .body { max-height:none; }
  .tl { margin-top:8px; border-left:2px solid var(--line); padding-left:10px; display:none; }
  .h.open .tl { display:block; }
  .tl .ev { font-size:11px; color:var(--dim); position:relative; margin:3px 0; }
  .tl .ev::before { content:''; position:absolute; left:-15px; top:5px; width:7px; height:7px; border-radius:50%; background:var(--line); }
  .tl .ev b { color:var(--txt); }
  .h .acts { display:flex; gap:6px; margin-top:7px; }
  button.act { font-size:12px; border-radius:6px; border:1px solid var(--line); padding:3px 11px; cursor:pointer; background:#0d1117; color:var(--txt); }
  button.ok { border-color:var(--green); color:var(--green); } button.no { border-color:var(--red); color:var(--red); }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:12px; width:440px; padding:0; }
  dialog .dh { padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  dialog .db { padding:14px 16px; display:grid; gap:9px; } dialog label { font-size:12px; color:var(--dim); }
  dialog input, dialog textarea { width:100%; background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:7px 9px; font:inherit; }
  dialog textarea { min-height:90px; resize:vertical; } dialog .df { display:flex; gap:8px; justify-content:flex-end; padding:0 16px 14px; }
  ::backdrop { background:rgba(0,0,0,.55); }
</style>

<header>
  <h1>BuildHUD <span>· handoff cockpit</span></h1>
  <div id="summary"></div>
  <div id="add">
    <input id="addName" placeholder="new agent id…" onkeydown="if(event.key==='Enter')addAgent()">
    <button class="btn" onclick="addAgent()">＋ agent</button>
    <button class="btn" onclick="saveFlow()" title="Save the wired graph as a workflow">💾 save</button>
    <button class="btn" onclick="runFlow()" title="Run the wired graph topologically">▶ run</button>
    <span id="conn">connecting…</span>
  </div>
</header>
<div class="wrap">
  <div id="canvas"><svg class="links"><g id="staticlinks"></g><path id="tempwire" class="tw" fill="none"></path></svg><div class="hint" id="hint">No agents yet — add one, or start the hub with prototype/agents/*.json.</div></div>
  <div id="panel"><h2>Handoffs <span class="clear" id="clear" style="display:none" onclick="setFilter(null)">clear filter ✕</span></h2><div id="list"></div></div>
</div>

<dialog id="send"><form method="dialog">
  <div class="dh">Hand off <span id="sdFrom"></span> → <span id="sdTo"></span></div>
  <div class="db">
    <div><label>skill</label><input id="sdSkill" placeholder="review-branch"></div>
    <div><label>input</label><textarea id="sdInput" placeholder="what should the agent do?"></textarea></div>
  </div>
  <div class="df"><button value="cancel" class="act">cancel</button><button id="sdSend" value="send" class="act ok">send handoff</button></div>
</form></dialog>

<script>
const $ = (s, r=document) => r.querySelector(s);
const POS = {}; const expanded = new Set(); let filter = null;
let state = { agents: [], handoffs: [] }; let nodeDrag = null;
// Wave A flow-draft wiring (client-side only; Wave B persists it to workflows.json).
let EDGES = []; let wiring = null; let eidc = 0;
const cssid = (s) => s.replace(/[^a-zA-Z0-9_-]/g, '_');
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STC = { submitted:'var(--grey)', awaiting_approval:'var(--amber)', approved:'var(--blue)', running:'var(--blue)', completed:'var(--green)', failed:'var(--red)', rejected:'var(--red)' };
const FLOW = new Set(['submitted','awaiting_approval','approved','running']);
function rel(ts){ const s=Math.max(0,(Date.now()-ts)/1000); if(s<60)return Math.round(s)+'s'; if(s<3600)return Math.round(s/60)+'m'; if(s<86400)return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; }

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'content-type':'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
async function refresh() {
  try { state = await api('/api/state'); $('#conn').textContent='● live'; $('#conn').style.color='var(--green)'; render(); }
  catch { $('#conn').textContent='○ hub offline'; $('#conn').style.color='var(--red)'; }
}
function setFilter(f){ filter = (filter===f)?null:f; render(); }
async function addAgent(){ const n=$('#addName').value.trim(); if(!n)return; await api(`/api/agents/${encodeURIComponent(n)}/policy`,{policy:'approval'}); $('#addName').value=''; refresh(); }
// Wave B2: turn the wired draft (EDGES + the agents they touch) into a flow {nodes,edges}; save it / run it via the hub.
function buildFlow(){ if(!EDGES.length) return null;
  const ids=new Set(); EDGES.forEach(e=>{ids.add(e.source);ids.add(e.target);});
  const nodes=[...ids].map(id=>{ const a=ag(id); return { id, kind:'agent', agent:id, skill:a?.skill||'task', x:Math.round(POS[id]?.x||0), y:Math.round(POS[id]?.y||0) }; });
  return { nodes, edges:EDGES.map(e=>({ id:e.id, source:e.source, target:e.target })) }; }
async function saveFlow(){ const f=buildFlow(); if(!f) return alert('Wire nodes first: drag an out-port (right) onto an in-port (left).');
  const name=prompt('Workflow name', f.nodes.map(n=>n.id.split('-')[0]).join('→')); if(!name) return;
  const wf=await api('/api/workflows',{ name, nodes:f.nodes, edges:f.edges }); $('#conn').textContent='saved '+wf.id; refresh(); }
async function runFlow(){ const f=buildFlow(); if(!f) return alert('Wire nodes first: drag an out-port (right) onto an in-port (left).');
  const input=prompt('Input for the entry node(s)','Target brief: Series A fintech VPs of Sales scaling outbound.'); if(input===null) return;
  await api('/api/runflow',{ nodes:f.nodes, edges:f.edges, input }); refresh(); }

function render(){
  renderSummary(); placeNodes(); renderNodes(); drawLinks(); renderList();
}
function renderSummary(){
  const c = {}; for(const h of state.handoffs) c[h.status]=(c[h.status]||0)+1;
  const onN = state.agents.filter(a=>a.online).length;
  const pill = (k,label,n)=>`<span class="cnt ${k} ${filter===k?'on':''}" onclick="setFilter('${k}')"><b>${n||0}</b> ${label}</span>`;
  $('#summary').innerHTML =
    `<span class="cnt online" style="cursor:default"><b>${onN}</b>/${state.agents.length} online</span>`+
    pill('submitted','queued',c.submitted)+pill('awaiting_approval','awaiting',c.awaiting_approval)+
    pill('running','running',(c.running||0)+(c.approved||0))+pill('completed','done',c.completed)+
    pill('failed','failed',(c.failed||0)+(c.rejected||0));
}
function placeNodes(){
  const COLW=250, ROWH=156, per=Math.max(1,Math.floor(((($('#canvas').clientWidth)||900)-40)/COLW));
  state.agents.forEach((a,i)=>{ if(!POS[a.id]) POS[a.id]={ x:30+(i%per)*COLW, y:30+Math.floor(i/per)*ROWH }; });
}
function renderNodes(){
  const canvas=$('#canvas'); $('#hint').style.display=state.agents.length?'none':'block';
  const seen=new Set();
  for(const a of state.agents){
    const nid='n_'+cssid(a.id); seen.add(nid);
    let n=document.getElementById(nid);
    if(!n){ n=document.createElement('div'); n.className='node'; n.id=nid; n.dataset.id=a.id; canvas.appendChild(n);
      // node-body drag = live reposition; release on another node = send handoff (preserved); release on empty = move.
      n.addEventListener('pointerdown',e=>{
        if(wiring||e.button!==0||e.target.closest('.port')||e.target.closest('[data-pol]'))return;
        e.preventDefault(); const p=canvasPt(e); const o=POS[a.id]||{x:n.offsetLeft,y:n.offsetTop};
        nodeDrag={ id:a.id, node:n, offX:p.x-o.x, offY:p.y-o.y, startX:o.x, startY:o.y, moved:false };
        n.classList.add('dragging'); n.style.pointerEvents='none';
      });
    }
    n.style.left=POS[a.id].x+'px'; n.style.top=POS[a.id].y+'px';
    const mine=state.handoffs.filter(h=>h.to===a.id);
    const pending=mine.filter(h=>FLOW.has(h.status)).length;
    const busy=mine.some(h=>h.status==='running'||h.status==='approved');
    n.classList.toggle('busy',busy);
    n.innerHTML=`<div class="name"><span class="dot ${a.online?'on':''}"></span>${esc(a.id)}<span class="badge">${pending}</span></div>
      <div class="co">${esc(a.company||'—')}${a.skill?` · ${esc(a.skill)}`:''}</div>
      <div class="row"><span class="pill ${a.policy}" data-pol="${esc(a.id)}">${a.policy==='auto'?'⚡ auto':'✋ approval'}</span>
      <span>${a.online?'online':'offline'}</span>${busy?'<span style="color:var(--blue)">▶ running</span>':''}</div>
      <span class="port in"  data-in="${esc(a.id)}"  data-t="${esc((a.accepts||['*']).join(', '))}"></span>
      <span class="port out" data-out="${esc(a.id)}" data-t="${esc((a.emits||['*']).join(', '))}"></span>`;
  }
  for(const n of [...canvas.querySelectorAll('.node')]) if(!seen.has(n.id)) n.remove();
  canvas.querySelectorAll('[data-pol]').forEach(el=>el.onclick=ev=>{ev.stopPropagation();togglePolicy(el.getAttribute('data-pol'));});
  canvas.querySelectorAll('[data-out]').forEach(el=> el.onpointerdown = ev=>startWire(ev, el.getAttribute('data-out')));
}
function center(id){ const n=document.getElementById('n_'+cssid(id)); if(!n)return null; return {x:n.offsetLeft+n.offsetWidth/2,y:n.offsetTop+n.offsetHeight/2}; }
// ---- Wave A: typed port wiring (out→in), client-side flow draft ----
const ag = (id) => state.agents.find(a=>a.id===id);
function portPos(id, side){ const n=document.getElementById('n_'+cssid(id)); if(!n)return null;
  return { x: side==='out'? n.offsetLeft+n.offsetWidth : n.offsetLeft, y: n.offsetTop+n.offsetHeight/2 }; }
function fpath(a,b){ const dx=Math.max(36, Math.abs(b.x-a.x)*0.5); return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`; }
function canConnect(src,tgt){ if(!src||!tgt||src===tgt)return false; const e=ag(src)?.emits||['*'], a=ag(tgt)?.accepts||['*'];
  return e.includes('*')||a.includes('*')||e.some(t=>a.includes(t)); }            // isValidConnection = type intersection
function matchType(src,tgt){ const e=ag(src)?.emits||['*'], a=ag(tgt)?.accepts||['*'];
  const common=e.find(t=>t!=='*'&&a.includes(t)); if(common)return common;
  if(a.includes('*')) return e.find(t=>t!=='*')||'*'; if(e.includes('*')) return a.find(t=>t!=='*')||'*'; return '*'; }
function canvasPt(e){ const c=$('#canvas'), r=c.getBoundingClientRect(); return { x:e.clientX-r.left+c.scrollLeft, y:e.clientY-r.top+c.scrollTop }; }
function startWire(e, src){ e.preventDefault(); e.stopPropagation(); wiring={ src, pt:null, over:null };
  document.body.classList.add('wiring'); updateTemp(); }
function updateTemp(){ const tw=$('#tempwire'); if(!wiring){ tw.removeAttribute('d'); return; }
  const a=portPos(wiring.src,'out'); if(!a)return;
  const b = wiring.over ? portPos(wiring.over,'in') : (wiring.pt||a);
  const ok = wiring.over ? canConnect(wiring.src,wiring.over) : null;
  tw.setAttribute('d', fpath(a,b)); tw.setAttribute('stroke-width','2');
  tw.setAttribute('stroke', ok===true?'var(--green)':ok===false?'var(--red)':'var(--blue)'); }
function tryConnect(src,tgt){ if(!canConnect(src,tgt))return false;
  if(EDGES.some(x=>x.source===src&&x.target===tgt))return false;
  EDGES.push({ id:'fe_'+(++eidc), source:src, target:tgt, type:matchType(src,tgt) }); drawLinks(); return true; }
function endWire(){ if(!wiring)return; if(wiring.over) tryConnect(wiring.src, wiring.over);
  wiring=null; document.body.classList.remove('wiring'); $('#tempwire').removeAttribute('d');
  document.querySelectorAll('.port.in').forEach(p=>p.classList.remove('valid','invalid')); }
// hit-test the in-port under the pointer (elementFromPoint works for mouse + touch implicit capture)
document.addEventListener('pointermove', e=>{ if(!wiring)return; wiring.pt=canvasPt(e);
  document.querySelectorAll('.port.in').forEach(p=>p.classList.remove('valid','invalid'));
  const inp=(document.elementFromPoint(e.clientX,e.clientY)||{}).closest?.('.port.in');
  if(inp){ const t=inp.getAttribute('data-in'); wiring.over=t; inp.classList.add(canConnect(wiring.src,t)?'valid':'invalid'); }
  else wiring.over=null;
  updateTemp(); });
document.addEventListener('pointerup', endWire);
// node-body drag: live reposition + drop-on-node highlight
document.addEventListener('pointermove', e=>{ if(!nodeDrag)return;
  const p=canvasPt(e); POS[nodeDrag.id]={ x:Math.max(0,p.x-nodeDrag.offX), y:Math.max(0,p.y-nodeDrag.offY) };
  nodeDrag.node.style.left=POS[nodeDrag.id].x+'px'; nodeDrag.node.style.top=POS[nodeDrag.id].y+'px'; nodeDrag.moved=true;
  document.querySelectorAll('.node.drop').forEach(x=>x.classList.remove('drop'));
  const over=(document.elementFromPoint(e.clientX,e.clientY)||{}).closest?.('.node');
  if(over&&over!==nodeDrag.node) over.classList.add('drop');
  drawLinks(); });
document.addEventListener('pointerup', e=>{ if(!nodeDrag)return; const nd=nodeDrag; nodeDrag=null;
  nd.node.classList.remove('dragging'); nd.node.style.pointerEvents='';
  document.querySelectorAll('.node.drop').forEach(x=>x.classList.remove('drop'));
  const over=nd.moved && (document.elementFromPoint(e.clientX,e.clientY)||{}).closest?.('.node');
  if(over&&over!==nd.node&&over.dataset.id){                        // drop on another node = send (source snaps back)
    POS[nd.id]={x:nd.startX,y:nd.startY}; nd.node.style.left=nd.startX+'px'; nd.node.style.top=nd.startY+'px';
    openSend(nd.id, over.dataset.id);
  }
  drawLinks(); });
function drawLinks(){
  // flow-draft wiring (Wave A): solid bezier, type label, click-to-delete
  const fe = EDGES.map(e=>{ const a=portPos(e.source,'out'), b=portPos(e.target,'in'); if(!a||!b)return '';
    const d=fpath(a,b), mx=(a.x+b.x)/2, my=(a.y+b.y)/2, w=Math.max(22, esc(e.type).length*6+10);
    return `<path d="${d}" fill="none" stroke="var(--blue)" stroke-width="2" opacity=".85"/>`
      +`<path class="hit" d="${d}" data-edge="${e.id}"></path>`
      +`<rect x="${mx-w/2}" y="${my-9}" rx="5" width="${w}" height="16" fill="#0d1117" stroke="var(--line)"/>`
      +`<text x="${mx}" y="${my+3}" text-anchor="middle" font-size="10" fill="var(--blue)">${esc(e.type)}</text>`;
  }).join('');
  // handoff runtime edges (center→center, animated in-flight)
  const he = state.handoffs.slice(-50).map(h=>{ const a=center(h.from),b=center(h.to); if(!a||!b)return '';
    const c=STC[h.status]||'var(--grey)'; const mx=(a.x+b.x)/2; const flow=FLOW.has(h.status);
    return `<path class="${flow?'flow':''}" d="M${a.x},${a.y} Q${mx},${a.y} ${mx},${(a.y+b.y)/2} T${b.x},${b.y}" fill="none" stroke="${c}" stroke-width="2" opacity="${h.status==='completed'?0.45:0.9}"/><circle cx="${b.x}" cy="${b.y}" r="3.5" fill="${c}"/>`;
  }).join('');
  $('#staticlinks').innerHTML = fe + he;
  $('#staticlinks').querySelectorAll('.hit').forEach(el=> el.onclick=()=>{ EDGES=EDGES.filter(x=>x.id!==el.dataset.edge); drawLinks(); });
}
function renderList(){
  $('#clear').style.display=filter?'inline':'none';
  let hs=[...state.handoffs].reverse();
  if(filter) hs=hs.filter(h=> filter==='running'?['running','approved'].includes(h.status): filter==='failed'?['failed','rejected'].includes(h.status): h.status===filter);
  $('#list').innerHTML = hs.map(h=>{ const open=expanded.has(h.id);
    return `<div class="h ${open?'open':''}" data-id="${h.id}">
      <div class="top"><span class="st ${h.status}">${h.status}</span>
        <span class="who"><b>${esc(h.from)}</b> → <b>${esc(h.to)}</b> · ${esc(h.skill)}</span>
        <span class="time">${rel(h.updatedAt)} ago</span></div>
      ${h.input?`<div class="body">${esc(h.input).slice(0,open?2000:160)}</div>`:''}
      ${h.result?`<div class="body" style="color:var(--green)">${esc(h.result).slice(0,open?4000:300)}</div>`:''}
      ${h.error?`<div class="body" style="color:var(--red)">${esc(h.error)}</div>`:''}
      <div class="tl">${(h.history||[]).map(e=>`<div class="ev"><b>${e.status}</b> · ${esc(e.by||'')} · ${rel(e.ts)} ago</div>`).join('')}</div>
      ${h.status==='awaiting_approval'?`<div class="acts"><button class="act ok" data-ok="${h.id}">approve</button><button class="act no" data-no="${h.id}">decline</button></div>`:''}
    </div>`; }).join('') || `<div class="hint" style="padding:6px 2px">${filter?'No handoffs in this filter.':'No handoffs yet — drag an agent onto another.'}</div>`;
  $('#list').querySelectorAll('.h').forEach(el=>el.onclick=()=>{ const id=el.getAttribute('data-id'); expanded.has(id)?expanded.delete(id):expanded.add(id); render(); });
  $('#list').querySelectorAll('[data-ok]').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.getAttribute('data-ok'),'approve');});
  $('#list').querySelectorAll('[data-no]').forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.getAttribute('data-no'),'decline');});
}
function openSend(from,to){ const ta=state.agents.find(a=>a.id===to);
  $('#sdFrom').textContent=from; $('#sdTo').textContent=to; $('#sdSkill').value=ta?.skill||''; $('#sdInput').value='';
  const dlg=$('#send'); dlg.showModal();
  $('#sdSend').onclick=async e=>{ e.preventDefault(); await api('/api/handoffs',{from,to,skill:$('#sdSkill').value.trim()||'task',input:$('#sdInput').value}); dlg.close(); refresh(); };
}
async function act(id,what){ await api(`/api/handoffs/${id}/${what}`,{}); refresh(); }
async function togglePolicy(id){ const a=state.agents.find(x=>x.id===id); await api(`/api/agents/${id}/policy`,{policy:a?.policy==='auto'?'approval':'auto'}); refresh(); }

refresh(); setInterval(refresh, 1500); window.addEventListener('resize', render);
</script>

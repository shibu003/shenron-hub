<!doctype html>
<meta charset="utf-8">
<title>BuildHUD — handoff cockpit</title>
<!-- Zero-dep cockpit for the durable handoff hub. Drag one agent onto another to send a handoff.
     Agents that are offline still receive it (durable inbox) and act on next poll. React Flow is the
     later upgrade (docs G2); this is vanilla DnD to keep the prototype dependency-free. -->
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --amber:#d29922; --blue:#58a6ff; --red:#f85149; --grey:#6e7681; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; } header .dim { color:var(--dim); font-size:12px; }
  #conn { margin-left:auto; font-size:12px; color:var(--dim); }
  .wrap { display:grid; grid-template-columns:1fr 380px; height:calc(100vh - 47px); }
  #canvas { position:relative; overflow:auto; }
  svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; width:200px; background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:10px 12px; cursor:grab; user-select:none; transition:border-color .15s, box-shadow .15s; }
  .node:hover { border-color:var(--blue); }
  .node.drop { border-color:var(--green); box-shadow:0 0 0 2px var(--green) inset; }
  .node .name { font-weight:600; display:flex; align-items:center; gap:7px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--grey); flex:none; }
  .dot.on { background:var(--green); box-shadow:0 0 7px var(--green); }
  .node .co { color:var(--dim); font-size:11px; margin:1px 0 8px; }
  .node .row { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); }
  .pill { border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:999px; font-size:11px;
          padding:2px 9px; cursor:pointer; }
  .pill.auto { border-color:var(--amber); color:var(--amber); } .pill.approval { border-color:var(--blue); color:var(--blue); }
  .badge { margin-left:auto; background:#0d1117; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; }
  .hint { padding:14px 16px; color:var(--dim); font-size:12px; }
  #panel { border-left:1px solid var(--line); overflow:auto; padding:12px; }
  #panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:6px 2px; }
  .h { border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px; background:var(--panel); }
  .h .top { display:flex; align-items:center; gap:8px; font-size:12px; }
  .h .who { color:var(--dim); } .h .who b { color:var(--txt); }
  .st { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid; }
  .st.submitted{color:var(--grey);border-color:var(--grey)} .st.awaiting_approval{color:var(--amber);border-color:var(--amber)}
  .st.approved,.st.running{color:var(--blue);border-color:var(--blue)} .st.completed{color:var(--green);border-color:var(--green)}
  .st.failed,.st.rejected{color:var(--red);border-color:var(--red)}
  .h .body { font-size:12px; color:var(--dim); margin-top:6px; white-space:pre-wrap; max-height:120px; overflow:auto; }
  .h .acts { display:flex; gap:6px; margin-top:7px; }
  button.act { font-size:12px; border-radius:6px; border:1px solid var(--line); padding:3px 11px; cursor:pointer; background:#0d1117; color:var(--txt); }
  button.ok { border-color:var(--green); color:var(--green); } button.no { border-color:var(--red); color:var(--red); }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:12px; width:440px; padding:0; }
  dialog .dh { padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  dialog .db { padding:14px 16px; display:grid; gap:9px; } dialog label { font-size:12px; color:var(--dim); }
  dialog input, dialog textarea { width:100%; background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:7px 9px; font:inherit; }
  dialog textarea { min-height:90px; resize:vertical; } dialog .df { display:flex; gap:8px; justify-content:flex-end; padding:0 16px 14px; }
  ::backdrop { background:rgba(0,0,0,.55); }
</style>

<header>
  <h1>BuildHUD <span class="dim">— handoff cockpit</span></h1>
  <span class="dim">drag one agent onto another to hand off · offline agents receive it on next poll</span>
  <span id="conn">connecting…</span>
</header>
<div class="wrap">
  <div id="canvas"><svg class="links"></svg><div class="hint" id="hint">No agents yet. Start a hub + an agent worker.</div></div>
  <div id="panel"><h2>Handoffs</h2><div id="list"></div></div>
</div>

<dialog id="send">
  <form method="dialog">
    <div class="dh">Hand off <span id="sdFrom"></span> → <span id="sdTo"></span></div>
    <div class="db">
      <div><label>skill</label><input id="sdSkill" placeholder="review-branch"></div>
      <div><label>input</label><textarea id="sdInput" placeholder="what should the agent do?"></textarea></div>
    </div>
    <div class="df"><button value="cancel" class="act">cancel</button><button id="sdSend" value="send" class="act ok">send handoff</button></div>
  </form>
</dialog>

<script>
const API = ''; // same origin
const $ = (s, r=document) => r.querySelector(s);
const POS = {}; // agentId -> {x,y} persisted layout
let state = { agents: [], handoffs: [] };
let dragFrom = null;

async function api(path, body) {
  const r = await fetch(API + path, { method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}
async function refresh() {
  try { state = await api('/api/state'); $('#conn').textContent = '● live'; $('#conn').style.color = 'var(--green)'; render(); }
  catch { $('#conn').textContent = '○ hub offline'; $('#conn').style.color = 'var(--red)'; }
}

function place(agents) {
  // simple stable grid layout, kept in POS so nodes don't jump between polls
  const COLW = 250, ROWH = 150, perRow = Math.max(1, Math.floor((($('#canvas').clientWidth) - 40) / COLW));
  agents.forEach((a, i) => { if (!POS[a.id]) POS[a.id] = { x: 30 + (i % perRow) * COLW, y: 30 + Math.floor(i / perRow) * ROWH }; });
}
function center(id) { const n = document.getElementById('n_' + cssid(id)); if (!n) return null;
  return { x: n.offsetLeft + n.offsetWidth / 2, y: n.offsetTop + n.offsetHeight / 2 }; }
const cssid = (s) => s.replace(/[^a-zA-Z0-9_-]/g, '_');
const STC = { submitted:'var(--grey)', awaiting_approval:'var(--amber)', approved:'var(--blue)', running:'var(--blue)', completed:'var(--green)', failed:'var(--red)', rejected:'var(--red)' };

function render() {
  const canvas = $('#canvas');
  $('#hint').style.display = state.agents.length ? 'none' : 'block';
  place(state.agents);
  // nodes
  const seen = new Set();
  for (const a of state.agents) {
    seen.add('n_' + cssid(a.id));
    let n = document.getElementById('n_' + cssid(a.id));
    if (!n) {
      n = document.createElement('div'); n.className = 'node'; n.id = 'n_' + cssid(a.id); n.draggable = true; canvas.appendChild(n);
      n.addEventListener('dragstart', e => { dragFrom = a.id; e.dataTransfer.setData('text/plain', a.id); });
      n.addEventListener('dragover', e => { if (dragFrom && dragFrom !== a.id) { e.preventDefault(); n.classList.add('drop'); } });
      n.addEventListener('dragleave', () => n.classList.remove('drop'));
      n.addEventListener('drop', e => { e.preventDefault(); n.classList.remove('drop'); const from = e.dataTransfer.getData('text/plain'); if (from && from !== a.id) openSend(from, a.id); });
    }
    n.style.left = POS[a.id].x + 'px'; n.style.top = POS[a.id].y + 'px';
    const pending = state.handoffs.filter(h => h.to === a.id && ['submitted','awaiting_approval','approved','running'].includes(h.status)).length;
    n.innerHTML = `<div class="name"><span class="dot ${a.online?'on':''}"></span>${esc(a.id)}<span class="badge">${pending}</span></div>
      <div class="co">${esc(a.company||'')}${a.skill?` · ${esc(a.skill)}`:''}</div>
      <div class="row"><span class="pill ${a.policy}" data-pol="${esc(a.id)}">${a.policy==='auto'?'⚡ auto':'✋ approval'}</span>
      <span>${a.online?'online':'offline'}</span></div>`;
  }
  for (const n of [...canvas.querySelectorAll('.node')]) if (!seen.has(n.id)) n.remove();
  canvas.querySelectorAll('[data-pol]').forEach(el => el.onclick = () => togglePolicy(el.getAttribute('data-pol')));
  drawLinks();
  renderList();
}
function drawLinks() {
  const svg = $('svg.links'); const recent = state.handoffs.slice(-40);
  svg.innerHTML = recent.map(h => { const a = center(h.from), b = center(h.to); if (!a || !b) return '';
    const c = STC[h.status] || 'var(--grey)'; const dash = ['submitted','awaiting_approval'].includes(h.status) ? '6 5' : '0';
    const mx = (a.x+b.x)/2; return `<path d="M${a.x},${a.y} Q${mx},${a.y} ${mx},${(a.y+b.y)/2} T${b.x},${b.y}" fill="none" stroke="${c}" stroke-width="2" stroke-dasharray="${dash}" opacity="${h.status==='completed'?0.5:0.9}"/>
      <circle cx="${b.x}" cy="${b.y}" r="3.5" fill="${c}"/>`; }).join('');
}
function renderList() {
  $('#list').innerHTML = [...state.handoffs].reverse().map(h => `
    <div class="h">
      <div class="top"><span class="st ${h.status}">${h.status}</span>
        <span class="who"><b>${esc(h.from)}</b> → <b>${esc(h.to)}</b> · ${esc(h.skill)}</span></div>
      ${h.input?`<div class="body">${esc(h.input).slice(0,200)}</div>`:''}
      ${h.result?`<div class="body" style="color:var(--green)">${esc(h.result).slice(0,400)}</div>`:''}
      ${h.error?`<div class="body" style="color:var(--red)">${esc(h.error)}</div>`:''}
      ${h.status==='awaiting_approval'?`<div class="acts"><button class="act ok" data-ok="${h.id}">approve</button><button class="act no" data-no="${h.id}">decline</button></div>`:''}
    </div>`).join('') || '<div class="hint" style="padding:6px 2px">No handoffs yet — drag an agent onto another.</div>';
  $('#list').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => act(b.getAttribute('data-ok'), 'approve'));
  $('#list').querySelectorAll('[data-no]').forEach(b => b.onclick = () => act(b.getAttribute('data-no'), 'decline'));
}

function openSend(from, to) {
  const ta = state.agents.find(a => a.id === to);
  $('#sdFrom').textContent = from; $('#sdTo').textContent = to;
  $('#sdSkill').value = ta?.skill || ''; $('#sdInput').value = '';
  const dlg = $('#send'); dlg.returnValue = '';
  dlg.showModal();
  $('#sdSend').onclick = async (e) => { e.preventDefault();
    await api('/api/handoffs', { from, to, skill: $('#sdSkill').value.trim() || 'task', input: $('#sdInput').value });
    dlg.close(); refresh();
  };
}
async function act(id, what) { await api(`/api/handoffs/${id}/${what}`, {}); refresh(); }
async function togglePolicy(id) { const a = state.agents.find(x => x.id === id); await api(`/api/agents/${id}/policy`, { policy: a?.policy === 'auto' ? 'approval' : 'auto' }); refresh(); }
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

refresh(); setInterval(refresh, 1500);
window.addEventListener('resize', render);
</script>

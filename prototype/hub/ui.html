<!doctype html>
<meta charset="utf-8">
<title>BuildHUD — cockpit</title>
<!-- Langflow-style visual flow-builder for the durable handoff hub. Left palette · top toolbar ·
     canvas · right inspector. Click a node to configure it. Drag the body to move, drag a port to
     wire (typed). Save/Run a flow, or turn a trigger→chain into an automation. JA/EN toggle (🌐).
     Zero-dep; the hub re-reads this file per GET / (edit + reload, no restart). -->
<style>
  :root { --bg:#0e1116; --panel:#161b22; --panel2:#1b2129; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --amber:#d29922; --blue:#58a6ff; --red:#f85149; --grey:#6e7681; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); overflow:hidden; }
  button { font:inherit; }
  #topbar { display:flex; align-items:center; gap:12px; height:48px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .brand { font-weight:600; font-size:14px; white-space:nowrap; } .brand span { color:var(--dim); font-weight:400; }
  #flowName { background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 10px; font:inherit; width:200px; }
  .tb-actions { display:flex; align-items:center; gap:8px; }
  .tb { border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:7px; padding:7px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .tb:hover { border-color:var(--blue); }
  .tb.primary { border-color:var(--blue); color:var(--blue); } .tb.go { border-color:var(--green); color:var(--green); }
  .tb.stop { border-color:var(--red); color:var(--red); } .tb.stop:hover { border-color:var(--red); background:rgba(248,81,73,.08); }
  .tb.collapse { border-color:#8957e5; color:#a371f7; } .tb.collapse:hover { border-color:#a371f7; background:rgba(137,87,229,.1); }
  .flowgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; max-height:58vh; overflow:auto; }
  .flowcard { text-align:left; padding:10px; cursor:pointer; } .flowcard:hover { border-color:var(--blue); } .fc-name { font-weight:600; margin-bottom:3px; }
  .menu { position:relative; }
  .menu-pop { position:absolute; top:38px; right:0; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:5px; min-width:230px; z-index:30; box-shadow:0 12px 34px -12px #000; display:none; }
  .menu-pop.open { display:block; }
  .menu-pop button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:8px 10px; border-radius:6px; cursor:pointer; }
  .menu-pop button:hover { background:#0d1117; } .menu-pop .mh { color:var(--dim); font-size:11px; padding:6px 10px 2px; }
  #conn { margin-left:auto; font-size:12px; color:var(--dim); min-width:70px; text-align:right; }
  #main-wrap { display:flex; height:calc(100vh - 49px); overflow:hidden; }
  #viewnav { width:42px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:8px 0; gap:4px; flex-shrink:0; }
  .vn { width:32px; height:32px; border:none; background:none; color:var(--dim); cursor:pointer; border-radius:6px; font-size:16px; display:flex; align-items:center; justify-content:center; }
  .vn:hover { background:var(--panel2); color:var(--txt); } .vn.active { background:var(--panel2); color:var(--blue); }
  .vn-spacer { flex:1; }
  #view-runs, #view-settings { flex:1; overflow:auto; padding:16px; max-width:720px; }
  #view-runs h2, #view-settings h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:0 0 12px; }
  #app { position:relative; display:grid; grid-template-columns:1fr var(--sidew,280px); flex:1; height:100%; min-width:0; }
  .resizer { position:absolute; top:0; height:100%; width:8px; z-index:18; cursor:col-resize; }
  .resizer::after { content:''; position:absolute; top:0; left:3px; width:2px; height:100%; background:var(--line); transition:background .12s; }
  .resizer:hover::after, .resizer.drag::after { background:var(--blue); }
  #sideResizer { right:var(--sidew,280px); transform:translateX(4px); }
  #sidebar { border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  #sidebar-pal { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
  #sidebar-ins { flex:1; overflow:auto; padding:13px; }
  .pal-head { padding:11px 13px 7px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  #palSearch { margin:0 11px 8px; background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 9px; font:inherit; }
  .pal-tip { margin:0 11px 9px; padding:8px 9px; border:1px solid #2a3440; border-radius:8px; background:#0f1620; color:#b8c7d8; font-size:11px; }
  .pal-tip b { color:var(--txt); }
  #palList { flex:1; overflow:auto; }
  .palrow { display:flex; align-items:center; gap:7px; padding:7px 11px; cursor:default; border-top:1px solid #20262d; }
  .palrow:hover { background:var(--panel2); }
  .palrow .pm { flex:1; min-width:0; } .palrow .pm b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .palrow .pm span { color:var(--dim); font-size:11px; }
  .palrow.trig .pm b { color:var(--amber); } .palrow.on { opacity:.5; }
  .palrow .pb { cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:1px 7px; color:var(--txt); background:#0d1117; }
  .palrow .pb:hover { border-color:var(--blue); }
  .pal-add { padding:9px 11px; border-top:1px solid var(--line); display:grid; gap:6px; }
  .pal-add input { background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 8px; font:inherit; }
  .pal-add .row2 { display:flex; gap:6px; } .pal-add .row2 button { flex:1; }
  .pal-add button { border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:7px; padding:6px; cursor:pointer; }
  .pal-add button:hover { border-color:var(--blue); }
  #canvas { position:relative; overflow:hidden; background-color:#08090c; cursor:grab; }
  #canvas.panning { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; width:6000px; height:4200px; transform-origin:0 0; will-change:transform;
           background-image:radial-gradient(circle at 1px 1px, #2b313a 1px, transparent 0); background-size:24px 24px; }
  svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #zoomctl { position:absolute; right:12px; bottom:14px; z-index:25; display:flex; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:3px; box-shadow:0 8px 24px -10px #000; }
  #zoomctl button { min-width:30px; height:26px; background:none; border:0; color:var(--txt); border-radius:6px; cursor:pointer; font:inherit; }
  #zoomctl button:hover { background:#0d1117; } #zoomctl #zoomPct { min-width:46px; color:var(--dim); font-size:11px; }
  svg .flow { stroke-dasharray:7 6; animation:dash .7s linear infinite; } @keyframes dash { to { stroke-dashoffset:-13; } }
  svg .hit { pointer-events:stroke; stroke:transparent; stroke-width:15; fill:none; cursor:pointer; }
  svg .tw { stroke-dasharray:6 5; opacity:.95; }
  #hint { position:absolute; top:16px; left:18px; color:var(--dim); font-size:12px; max-width:340px; }
  #coach { border-top:1px solid var(--line); padding:10px 11px; }
  .coach-card,.helpbox { border:1px solid #2f3d4c; background:linear-gradient(135deg,#111a25,#0d1117 72%); border-radius:14px; box-shadow:0 16px 42px -28px #000; }
  .coach-card { padding:14px; }
  .coach-title { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; margin-bottom:8px; }
  .coach-title span { color:var(--blue); }
  .steps { display:grid; gap:7px; margin:10px 0 12px; }
  .step { display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:start; color:#c9d7e5; font-size:12px; }
  .step b { display:inline-grid; place-items:center; height:22px; width:22px; border-radius:50%; background:#163252; color:#9bd1ff; font-size:11px; }
  .legend { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; color:var(--dim); font-size:11px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#0d1117; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; border:2px solid var(--blue); }
  .coach-actions { display:flex; gap:8px; align-items:center; }
  .coach-actions button,.linkbtn { border:1px solid var(--blue); background:#0d1117; color:var(--blue); border-radius:8px; padding:7px 10px; cursor:pointer; font:inherit; }
  .coach-actions button:hover,.linkbtn:hover { background:#10233a; }
  .coach-actions small { color:var(--dim); line-height:1.35; }
  #wireTip { position:absolute; z-index:20; display:none; max-width:320px; pointer-events:none; background:#0d1117; border:1px solid var(--blue); border-radius:9px; color:var(--txt); padding:8px 10px; font-size:12px; box-shadow:0 12px 28px -18px #000; }
  #wireTip.ok { border-color:var(--green); color:#bdf6c9; }
  #wireTip.bad { border-color:var(--red); color:#ffc2be; }
  /* per-node dynamic sizing — width fits content within [min,max]; height grows with the in-card settings */
  .node { position:absolute; width:fit-content; min-width:200px; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:0 0 9px; cursor:grab; user-select:none; box-shadow:0 2px 10px -3px rgba(0,0,0,.55); transition:border-color .12s, box-shadow .12s, transform .12s; }
  .node:hover { border-color:#48515c; box-shadow:0 12px 30px -12px rgba(0,0,0,.8); transform:translateY(-1px); z-index:7; }   /* overlap: raise the hovered node */
  .node.selected { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue), 0 8px 22px -10px var(--blue); z-index:8; }
  /* C1 floating wiring — drag from a node's rim to connect (any side); drop target highlights */
  body:not(.wiring) .node:hover { outline:1px dashed rgba(88,166,255,.45); outline-offset:3px; }   /* hint: the rim is draggable to connect */
  .node.wtarget { outline:2px solid var(--green); outline-offset:2px; }
  .node.wbad { outline:2px solid var(--red); outline-offset:2px; }
  .node.multi { box-shadow:0 0 0 2px var(--amber), 0 8px 22px -10px rgba(210,153,34,.6); }   /* ③b-2 shift-click multi-select */
  .node.busy { border-color:var(--blue); animation:busy 1.1s ease-in-out infinite; }
  @keyframes busy { 50% { box-shadow:0 0 14px -2px var(--blue), 0 0 0 1px var(--blue) inset; } }
  .node .name { font-weight:600; display:flex; align-items:center; gap:7px; padding:9px 12px; border-bottom:1px solid var(--line); border-radius:13px 13px 0 0; background:rgba(255,255,255,.022); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--grey); flex:none; }
  .dot.on { background:var(--green); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(63,185,80,.6);} 50%{ box-shadow:0 0 0 5px rgba(63,185,80,0);} }
  .node .co { color:var(--dim); font-size:11px; margin:0; padding:6px 12px 0; }
  .node .badge { margin-left:auto; background:#0d1117; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; }
  .node .pol { font-size:10px; color:var(--dim); margin-top:6px; padding:0 12px; } .node .pol.auto { color:var(--amber); }
  .node.trigger { min-width:204px; border-color:var(--amber); background:#1b1407; } .node.trigger .name { color:var(--amber); background:rgba(210,153,34,.14); }
  .node.mcp { min-width:240px; border-color:#2ea043; background:#0c1f12; } .node.mcp .name { color:#3fb950; background:rgba(46,160,67,.14); } .node.mcp .port { border-color:#2ea043; }
  .node.comp { min-width:244px; border-color:#8957e5; background:#150f23; } .node.comp .name { color:#a371f7; background:rgba(137,87,229,.16); } .node.comp .port { border-color:#8957e5; }
  /* per-node collapse (B1): fold the settings body via the header chevron */
  .ntoggle { cursor:pointer; color:var(--dim); font-size:11px; line-height:1; padding:0 1px; user-select:none; flex:none; }
  .ntoggle:hover { color:var(--txt); }
  .node.collapsed .nbody { display:none; }
  .node.collapsed.mcp .name, .node.collapsed.comp .name, .node.collapsed.agent .name { border-bottom:none; border-radius:13px; }
  /* agent card holds the capability passport editor (B2) — fixed width (it's a form; only height is dynamic) */
  .node.agent { width:248px; } .node.agent .name { color:#cdd9e5; background:rgba(255,255,255,.03); }
  .node.agent .co { white-space:normal; }
  .node.agent .nbody .presetrow { display:flex; gap:5px; flex-wrap:wrap; }
  .node.agent .nbody .presetrow button { flex:1; min-width:62px; font-size:10px; padding:4px 5px; background:#0d1117; border:1px solid var(--line); border-radius:6px; color:var(--txt); cursor:pointer; }
  .node.agent .nbody .presetrow button:hover { border-color:var(--blue); }
  .node.agent .nbody .ibtn { width:100%; box-sizing:border-box; }
  /* in-node settings — edit a component's fields directly on the card (Langflow-style) */
  .nbody { padding:8px 11px 2px; display:grid; gap:7px; }
  .nfrow { display:grid; gap:2px; }
  .nflabel { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .nf { width:100%; box-sizing:border-box; background:#0d1117; border:1px solid var(--line); border-radius:6px; color:var(--txt); padding:4px 7px; font:11px/1.35 ui-monospace,Menlo,monospace; }
  .nf:focus { border-color:var(--blue); outline:none; box-shadow:0 0 0 2px rgba(88,166,255,.25); }
  textarea.nf { resize:vertical; min-height:36px; }
  select.nf.nkind { font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-weight:600; }
  .nfbool { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--txt); cursor:pointer; } .nfbool input { width:auto; }
  .nfres { font-size:11px; color:var(--green); white-space:pre-wrap; max-height:96px; overflow:auto; border-top:1px solid var(--line); padding-top:5px; }
  .node.note { min-width:230px; max-width:300px; cursor:grab; } .node.note .notebody { padding:11px 13px; font-size:12px; line-height:1.55; color:#cdd9e5; white-space:normal; max-height:280px; overflow:auto; }
  .node.note .notebody b { color:#fff; }
  .port { position:absolute; width:15px; height:15px; border-radius:50%; background:#0d1117; border:2px solid var(--blue); top:50%; transform:translateY(-50%); cursor:crosshair; z-index:4; transition:transform .1s, box-shadow .12s; box-shadow:0 0 0 2px var(--panel); }
  .port.in { left:-11px; } .port.out { right:-11px; } .port:hover { transform:translateY(-50%) scale(1.2); box-shadow:0 0 0 4px rgba(230,237,243,.24); }
  .portlabel { position:absolute; top:50%; transform:translateY(-50%); color:#b8c7d8; font-size:9px; line-height:1; letter-spacing:.06em; background:#0d1117; border:1px solid #2f3d4c; border-radius:999px; padding:2px 5px; pointer-events:none; z-index:4; }
  .portlabel.in { right:calc(100% + 7px); left:auto; } .portlabel.out { left:calc(100% + 7px); right:auto; }
  .node.trigger .port.out { border-color:var(--amber); }
  .port.in.valid { border-color:var(--green); background:var(--green); box-shadow:0 0 0 4px rgba(63,185,80,.22); }
  .port.in.invalid { border-color:var(--red); background:var(--red); box-shadow:0 0 0 4px rgba(248,81,73,.22); }
  body.wiring, body.wiring .node { cursor:crosshair; }

  .ins-h { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:2px 2px 10px; display:flex; align-items:center; }
  .ins-h .back { margin-left:auto; cursor:pointer; color:var(--blue); text-transform:none; letter-spacing:0; }
  .field { margin-bottom:11px; } .field label { display:block; font-size:11px; color:var(--dim); margin-bottom:3px; }
  .field .v { font-size:13px; } .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { background:#0d1117; border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:11px; color:var(--txt); }
  .ibtn { width:100%; text-align:left; border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:7px; padding:8px 11px; cursor:pointer; margin-bottom:7px; display:flex; align-items:center; gap:8px; }
  .ibtn:hover { border-color:var(--blue); } .ibtn.danger:hover { border-color:var(--red); color:var(--red); }
  .ibtn.toggle.auto { border-color:var(--amber); color:var(--amber); } .ibtn.toggle.approval { border-color:var(--blue); color:var(--blue); }
  textarea.match { width:100%; background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:7px 9px; font:12px/1.4 ui-monospace,Menlo,monospace; min-height:64px; resize:vertical; }
  input.cin, select.cin { width:100%; box-sizing:border-box; background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:7px 9px; font:12px/1.4 ui-monospace,Menlo,monospace; }
  #trustpanel { position:absolute; top:12px; right:12px; width:340px; max-height:calc(100% - 24px); overflow:auto; z-index:30;
    background:rgba(13,17,23,.97); border:1px solid var(--amber); border-radius:10px; padding:11px 12px; box-shadow:0 8px 30px rgba(0,0,0,.5); font-size:12px; }
  #trustpanel .tp-h { display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  #trustpanel .tp-x { cursor:pointer; color:var(--dim); padding:0 4px; }
  #trustpanel .tp-sum { background:rgba(245,158,11,.10); border:1px solid var(--line); border-radius:6px; padding:6px 8px; margin-bottom:8px; }
  #trustpanel .tp-sec { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin:9px 0 4px; }
  #trustpanel .tp-row { display:flex; flex-direction:column; gap:2px; padding:5px 0; border-top:1px solid rgba(255,255,255,.05); }
  #trustpanel .tp-wire { font-family:ui-monospace,monospace; font-size:11px; }
  #trustpanel .tp-fence { display:inline-block; font-size:10px; background:#1c2230; border:1px solid var(--line); border-radius:4px; padding:0 5px; margin:1px 3px 1px 0; }
  #trustpanel .tp-fence.xco { border-color:var(--amber); color:var(--amber); }
  #trustpanel .tp-strip { color:var(--amber); } #trustpanel .tp-clean { color:var(--dim); } #trustpanel .tp-rt { color:var(--dim); font-style:italic; }
  #trustpanel .tp-cap { font-size:11px; color:var(--dim); } #trustpanel .tp-gate-approval { color:var(--amber); } #trustpanel .tp-gate-denied { color:var(--red); } #trustpanel .tp-gate-auto { color:var(--green); }
  #trustpanel .tp-note { font-size:10px; color:var(--dim); margin-top:9px; line-height:1.4; }
  #trustpanel .tp-diff { border:1px solid var(--blue); border-radius:6px; padding:6px 8px; margin-bottom:8px; background:rgba(88,166,255,.08); }
  #trustpanel .tp-diff b { font-size:11px; } #trustpanel .tp-d-row { font-size:11px; padding:2px 0; font-family:ui-monospace,monospace; }
  #trustpanel .tp-up { color:var(--green); } #trustpanel .tp-down { color:var(--amber); } #trustpanel .tp-d-neutral { color:var(--dim); }
  .presetrow { display:flex; gap:5px; flex-wrap:wrap; }
  .presetrow button { flex:1; min-width:88px; font-size:11px; padding:4px 6px; background:var(--panel2,#161b22); color:var(--ink,#e6edf3); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .presetrow button:hover { border-color:var(--amber); }
  .caprow { display:flex; align-items:center; gap:8px; margin:4px 0; }
  .caprow .capk { flex:0 0 92px; font-size:11px; color:var(--dim); font-family:ui-monospace,monospace; }
  .caprow select.cin { flex:1; }
  .trust-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .trust-card { border:1px solid var(--line); background:#0d1117; border-radius:8px; padding:8px; min-width:0; }
  .trust-card b { display:block; font-size:11px; margin-bottom:4px; }
  .trust-card .meta { font-size:11px; line-height:1.35; color:var(--dim); word-break:break-word; }
  .riskline { border:1px solid rgba(245,158,11,.55); color:var(--amber); background:rgba(245,158,11,.08); border-radius:8px; padding:7px 8px; font-size:12px; line-height:1.4; }
  .data-class { display:flex; gap:8px; align-items:flex-start; padding:8px; border:1px solid var(--line); background:#0d1117; border-radius:8px; margin-bottom:6px; }
  .data-class input { margin-top:2px; }
  .data-class.locked { opacity:.88; }
  .data-class .dc-body { flex:1; min-width:0; }
  .data-class .dc-title { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .data-class .dc-desc { color:var(--dim); font-size:11px; line-height:1.35; margin-top:2px; }
  .data-class .dc-mode { margin-left:auto; font-size:10px; color:var(--green); border:1px solid rgba(63,185,80,.45); border-radius:999px; padding:0 5px; white-space:nowrap; }
  .capmini { display:flex; flex-wrap:wrap; gap:4px; }
  .capmini span { font-size:10px; background:#1c2230; border:1px solid var(--line); border-radius:999px; padding:1px 7px; }

// Wave E3 — run verdict: the after-run counterpart to E1's before-run dry-run. "Was this run safe, and why?"
// in one glance, joining the tamper-evident audit + run state for the LATEST run. The raw audit trail below
// becomes the evidence; this is the answer. All data already exists (/api/audit + /api/state).
function trustSummary(){
  const runs=state.runs||[]; if(!runs.length) return '';
  const run=runs[runs.length-1], runId=run.id, pred=PREDICTED[runId]||null;   // Wave ④: predicted snapshot for this run (audit closed-loop)
  const hById={}; for(const h of state.handoffs) hById[h.id]=h;
  const inRun=e=> e.runId===runId || (e.handoff && hById[e.handoff] && hById[e.handoff].runId===runId);
  const ents=(AUDIT.entries||[]).filter(inRun);
  const leaks={}; let leakN=0;
  for(const e of ents.filter(x=>x.type==='redact')) for(const r of (e.removed||[])){ leaks[r.label]=(leaks[r.label]||0)+r.count; leakN+=r.count; }
  const sends=state.handoffs.filter(h=>h.runId===runId && h.mcp);
  const sent=sends.filter(h=>h.status==='completed').length, held=sends.filter(h=>h.status==='awaiting_approval').length;
  const blocked=ents.filter(e=>e.type==='deny').length + sends.filter(h=>h.status==='failed'||h.status==='rejected').length;
  const routes=ents.filter(e=>e.type==='route'), skipped=(run.skipped||[]).length;
  const verify=AUDIT.verify||{ok:true};
  const leakChips=Object.entries(leaks).map(([l,c])=>`<span class="ts-chip">${esc(l)}×${c}</span>`).join('')||`<span class="ts-clean">${t('ts_noleak')}</span>`;
  const routeRows=routes.map(e=>`<div class="ts-route">🔀 ${esc(e.node)} · ${esc(e.predicate)}=${e.result} → <b>${esc(e.branch)}</b></div>`).join('');
  return `<div class="tsum ${verify.ok?'ok':'bad'}">
    <div class="ts-h"><b>🔒 ${t('ts_title')}</b><span class="ts-run">#${esc(runId)} · ${esc(run.status)}</span><span class="ts-verify ${verify.ok?'ok':'bad'}">${verify.ok?t('aud_ok'):t('aud_bad')}</span></div>
    <div class="ts-line">${t('ts_stripped')} <b>${leakN}</b> · ${t('ts_sent')} <b>${sent}</b>${held?` · ${t('ts_held')} <b>${held}</b>`:''}${blocked?` · ${t('ts_blocked')} <b style="color:var(--red)">${blocked}</b>`:''}${skipped?` · ${t('ts_skipped')} <b>${skipped}</b>`:''}${pred?` · <span style="color:var(--dim)">${t('td_predicted')} ≥${pred.stripCount} / ${t('td_actual')} ${leakN}</span>`:''}</div>
    <div class="ts-chips">${leakChips}</div>${routeRows}
    <button class="ts-export" onclick="exportReceipt('${esc(runId)}')" style="margin-top:8px;font-size:11px;border:1px solid var(--line);background:#0d1117;color:var(--txt);border-radius:6px;padding:4px 9px;cursor:pointer">⤓ ${t('export_receipt')}</button></div>`;
}

function auditDetail(e){

  if(e.type==='send') return `${e.server||''}.${e.tool||''}${e.redacted?` (redacted ${e.redacted})`:''}`;

  if(e.type==='route') return `${e.node||''} ${e.predicate||''}=${e.result} → ${e.branch||''}`;
  return '';
}

async function collapseSelection(){

  const inExt=EDGES.filter(e=>S.has(e.target)&&!S.has(e.source));    // edges entering the selection from outside
  const outExt=EDGES.filter(e=>S.has(e.source)&&!S.has(e.target));   // edges leaving the selection to outside
  if(new Set(inExt.map(e=>e.target)).size>1 || new Set(outExt.map(e=>e.source)).size>1) return toast(t('t_collapse_linear'));

  outExt.forEach(e=>{ if(!EDGES.some(x=>x.source===wid&&x.target===e.target)) EDGES.push({ id:'fe_'+(++eidc), source:wid, target:e.target }); });

// Wave ④ — trust-DIFF: how an edit changed the trust posture vs the baseline (last Save/Run, or the first Check).
// Pure compare of two trustPreview snapshots; reused by the panel + the pre-run verdict. Honest: stripCount is
// concrete only for known-upstream wires, so summaryDelta.strip is a lower bound ("≥").
const SEND_RANK = { deny:0, denied:0, approval:1, allow:2, auto:2 };                 // permissiveness: deny < approval < allow
const gateSend = (g) => g.kind==='agent' ? (g.caps&&g.caps.external_send) : g.gate;
function trustDiff(before, after){
  if(!before||!after) return null;
  const bw=new Map((before.wires||[]).map(w=>[w.id,w])), aw=new Map((after.wires||[]).map(w=>[w.id,w]));
  const bg=new Map((before.gates||[]).map(g=>[g.node,g])), ag2=new Map((after.gates||[]).map(g=>[g.node,g]));
  const wireChanges=[];
  for(const [id,w] of aw){ const o=bw.get(id);
    if(!o){ wireChanges.push({id,kind:'added',dir:'neutral'}); continue; }
    if((o.fences||[]).join('|')!==(w.fences||[]).join('|')) wireChanges.push({id,kind:'fence',dir:(w.fences||[]).length<(o.fences||[]).length?'down':'up'}); }
  for(const id of bw.keys()) if(!aw.has(id)) wireChanges.push({id,kind:'removed',dir:'neutral'});
  const gateChanges=[];
  for(const [node,g] of ag2){ const o=bg.get(node);
    if(!o){ gateChanges.push({node,kind:'added',dir:'neutral'}); continue; }
    const nv=SEND_RANK[gateSend(g)]??1, ov=SEND_RANK[gateSend(o)]??1;
    if(nv!==ov) gateChanges.push({node,kind:'send',dir:nv>ov?'down':'up',before:gateSend(o),after:gateSend(g)}); }
  for(const node of bg.keys()) if(!ag2.has(node)) gateChanges.push({node,kind:'removed',dir:'neutral'});
  const d=(k)=>(after.summary[k]||0)-(before.summary[k]||0);
  const summaryDelta={ strip:d('stripCount'), gatedSends:d('gatedSends'), deniedSends:d('deniedSends') };
  const weaker = wireChanges.some(c=>c.dir==='down') || gateChanges.some(c=>c.dir==='down');
  const changed = !!(wireChanges.length||gateChanges.length||summaryDelta.strip||summaryDelta.gatedSends||summaryDelta.deniedSends);
  return { changed, weaker, wireChanges, gateChanges, summaryDelta };
}
function renderTrustDiff(d){

    rows.push(`<div class="tp-d-row ${tone(c.dir)}">${esc(c.id)}: ${lbl}</div>`); }
  for(const c of d.gateChanges){ const lbl=c.kind==='added'?t('td_gate_added'):c.kind==='removed'?t('td_gate_removed'):(c.dir==='down'?t('td_send_loose'):t('td_send_tight'));
    const detail=c.kind==='send'?` (${esc(c.before)}→${esc(c.after)})`:'';
    rows.push(`<div class="tp-d-row ${tone(c.dir)}">${esc(c.node)}: ${lbl}${detail}</div>`); }

}

  conn(msg); toast(msg);
  const ag=gaps.find(g=>g.kind==='agent');                                     // 旧 Ghost Writer の agentDraft を統合: agent gap は下書き agent をワンクリック追加で埋める
  if(ag){ const slug=((ag.what||'').toLowerCase().match(/[a-z0-9]+/g)||[]).slice(0,3).join('-'); showAgentDraft({ name:(slug||'new')+'-agent', skill:'task', accepts:['*'], emits:['text','*'], systemPrompt:`You are an agent that: ${ag.what}` }); }
}
function shenronPlan(){
  openModal({ title:t('sh_title'), info:t('sh_info'), submitLabel:t('sh_btn'),
    fields:[{key:'goal',label:'',type:'textarea',placeholder:t('sh_ph')}],
    onSubmit:async v=>{ const goal=(v.goal||'').trim(); if(!goal) return;
      let r; try{ r=await api('/api/shenron/plan',{goal,save:true}); }catch(e){ return toast(e.message||t('gw_empty')); }
      applyPlan(r);
    } });
}
function shenronRefine(){                                                    // Wave 5: 「Slack じゃなくメールに」を投げて前 plan を再生成（LAST_PLAN を context に）。多ターンは LAST_PLAN 更新で積み上がる。
  if(!LAST_PLAN) return;
  openModal({ title:t('sh_refine_title'), info:t('sh_refine_info'), submitLabel:t('sh_refine_btn'),
    fields:[{key:'instruction',label:'',type:'textarea',placeholder:t('sh_refine_ph')}],
    onSubmit:async v=>{ const instruction=(v.instruction||'').trim(); if(!instruction) return;
      toast(t('sh_refine_wait'));
      let r; try{ r=await api('/api/shenron/plan',{goal:LAST_PLAN.goal,context:{prev_plan:LAST_PLAN,instruction},save:true}); }catch(e){ return toast(e.message||t('gw_empty')); }
      applyPlan(r);
    } });
}
async function shenronBuild(){                                              // plan IR → Langflow JSON → re-import on canvas (round-trip: 🔗 ゼロ なら透明)
  if(!LAST_PLAN) return toast(t('gw_empty'));
  let r; try{ r=await api('/api/shenron/build',{plan:LAST_PLAN}); }catch(e){ return toast(e.message); }
  if(!r.flow) return toast(t('gw_empty'));
  importLangflowFlow(r.flow); conn(t('sh_built_lf'));                        // importLangflowFlow が node/edge 数を toast・LF_SOURCE もセット（pushToLangflow で実 Langflow 登録可）
}
async function shenronGaps(){                                               // Wave 4+9: gap → MCP server 生成 + spawn/handshake 検証 → 承認で integration 登録 → 再 plan が gap を実 mcp node に解決
  const gaps=(LAST_PLAN&&LAST_PLAN.missing)||[]; if(!gaps.length) return;
  const g=gaps[0];                                                          // ponytail: gap[0] のみ。N>1 の巡回は v2（多くの plan は不足 1 件）。
  toast(t('sh_gen_wait'));                                                  // 生成=LLM＋spawn 検証ループで数十秒〜
  let r; try{ r=await api('/api/shenron/gen-component',{what:g.what}); }catch(e){ return toast(e.message); }
  const head=(r.converged?`# ✅ ${t('sh_gaps_ok')} (iter ${r.iters}) → ${r.output}`:`# ⚠️ ${t('sh_gaps_fail')} (iter ${r.iters}): ${(r.error||'').split('\n').pop()}`)
    +`\n# gap: ${g.what}`+(gaps.length>1?`  (1/${gaps.length})`:'');
  const body=head+'\n\n'+(r.code||'');
  const canApprove=r.converged&&r.id&&!r.approved;                          // 収束した新規部品のみ承認可（cache hit は既 approved）
  openModal({ title:t('sh_gaps_result'), info:t('sh_gaps_info'), submitLabel: canApprove?t('sh_approve'):t('m_copy'),
    fields:[{key:'code',label:'',type:'readonly',value:body}],
    onSubmit: canApprove ? (async()=>{                                      // Wave 9 人ゲート: 承認 → server.py 書出 + integration 登録 → 再 plan が gap を実 mcp:<id>.run node に解決
        try{ await api('/api/shenron/components/approve',{id:r.id}); }catch(e){ return toast(e.message); }
        toast(t('sh_approved'));
        try{ applyPlan(await api('/api/shenron/plan',{goal:LAST_PLAN.goal,save:true})); }catch(e){ toast(e.message); }
      }) : (()=>copyText(body,t('t_snip_copied'))) });
}
function loadFlow(flow){                         // materialize a generated/saved flow onto the canvas (fresh draft)
  TRIGGERS=[]; MCP_NODES=[]; COMPONENTS=[]; NOTES=[]; EDGES=[]; clearTrust();   // stale dry-run no longer matches the new draft
  HIDDEN.clear(); state.agents.forEach(a=>HIDDEN.add(a.id));   // hide all, then reveal the flow's agents
  for(const n of flow.nodes){
    POS[n.id]={ x:n.x||40, y:n.y||40 };
    if(n.kind==='agent'){ HIDDEN.delete(n.agent||n.id); }
    else if(n.kind==='trigger'){ TRIGGERS.push({ id:n.id, kind:'trigger', type:(n.trigger&&n.trigger.type)||'build_state', match:(n.trigger&&n.trigger.match)||{} }); }
    else if(n.kind==='mcp'){ MCP_NODES.push({ id:n.id, kind:'mcp', server:n.server, tool:n.tool, accepts:n.accepts||['*'], emits:n.emits||['*'], config:n.config||{}, auto:!!n.auto }); }
    else if(n.kind==='note'){ NOTES.push({ id:n.id, text:n.text||'', color:n.color||'amber' }); }
    else if(COMP[n.kind]){ const m=COMP[n.kind]; const config=n.config||{}; if(n.kind==='workflow'&&n.ref&&!config.ref) config.ref=n.ref; COMPONENTS.push({ id:n.id, kind:n.kind, accepts:m.accepts.slice(), emits:m.emits.slice(), config }); }
  }
  EDGES=(flow.edges||[]).map(e=>({ id:e.id||('fe_'+(++eidc)), source:e.source, target:e.target, type:e.type||matchType(e.source,e.target), ...(e.share?{share:e.share}:{}), ...(e.branch?{branch:e.branch}:{}) }));
  deselect(); render();
}
// ---- Wave B: import a Langflow flow export (.json) → cockpit nodes/edges, so any Langflow flow lands here and
// gets the trust dimension Langflow lacks (per-edge firewall + per-agent passport + audit). Langflow node:
// { id, position:{x,y}, data:{ type:<Component>, display_name, node:{ outputs/base_classes, template } } }.
// Edge: { source, target, data:{ sourceHandle:{output_types[]}, targetHandle:{inputTypes[]} } } — typed.
const LF_KIND = { ChatInput:'input', TextInput:'input', ChatOutput:'output', TextOutput:'output', Prompt:'prompt', PromptComponent:'prompt', PromptTemplate:'prompt',
  LanguageModelComponent:'languagemodel', OpenAIModel:'languagemodel', AnthropicModel:'languagemodel', GroqModel:'languagemodel', GoogleGenerativeAIModel:'languagemodel', Agent:'languagemodel',
  StructuredOutput:'structured', ParseData:'parser', note:'note' };
const lfVal=(tmpl,k)=>{ const f=tmpl&&tmpl[k]; return f&&typeof f==='object'?f.value:f; };
function importLangflowFlow(lf){
  const flowId=(lf&&lf.id)||''; LF_SOURCE=lf;   // top-level id = flowId for /api/v1/run (kept on 🔗 nodes); raw kept for ⤴ re-upload
  const d=(lf&&lf.data)||lf||{}; const lns=d.nodes||[], les=d.edges||[];
  if(!lns.length) return toast(t('lf_empty'));
  const xs=lns.map(n=>n.position?.x||0), ys=lns.map(n=>n.position?.y||0), minx=Math.min(...xs), miny=Math.min(...ys), S=0.55;   // Langflow coords are large/spread → normalize into the canvas
  const nodes=lns.map(ln=>{ const dt=(ln.data&&ln.data.type)||(ln.type==='noteNode'?'note':''); const tmpl=(ln.data&&ln.data.node&&ln.data.node.template)||{};
    const kind=LF_KIND[dt]||'langflow', x=Math.round(((ln.position?.x||0)-minx)*S)+60, y=Math.round(((ln.position?.y||0)-miny)*S)+40;
    if(kind==='note') return { id:ln.id, kind:'note', text:lfVal(tmpl,'text')||(ln.data&&ln.data.node&&ln.data.node.template&&ln.data.node.template.note)||'📝', color:'blue', x, y };
    const config={ name:(ln.data&&ln.data.display_name)||dt };
    if(kind==='input') config.text=lfVal(tmpl,'input_value')||'';
    else if(kind==='prompt') config.template=lfVal(tmpl,'template')||'{input}';
    else if(kind==='languagemodel'){ const m=String(lfVal(tmpl,'model')||lfVal(tmpl,'model_name')||'').toLowerCase();
      config.model=/claude|anthropic/.test(m)?'claude':/gemini|google/.test(m)?'gemini':'stub';   // cockpit runner = claude CLI | stub; model/temperature are honored only when run IN Langflow
      config.system=lfVal(tmpl,'system_message')||lfVal(tmpl,'system')||''; const tp=lfVal(tmpl,'temperature'); if(tp!=null&&tp!=='') config.temperature=tp; }
    else if(kind==='parser') config.pattern=lfVal(tmpl,'template')||lfVal(tmpl,'pattern')||'{input}';
    else if(kind==='structured'){ const sc=lfVal(tmpl,'output_schema')||lfVal(tmpl,'schema');
      config.schema=Array.isArray(sc)?sc.map(f=>f&&(f.name||f.field||f.key)).filter(Boolean).join(','):(typeof sc==='string'?sc:''); config.instructions=lfVal(tmpl,'instructions')||lfVal(tmpl,'format_instructions')||''; }
    else if(kind==='langflow'){ config._lfType=dt; config._lfFlowId=flowId; config.desc=(ln.data&&ln.data.description)||''; }
    return { id:ln.id, kind, config, x, y };
  });
  const have=new Set(nodes.map(n=>n.id));
  const edges=les.map(le=>{ const so=(le.data&&le.data.sourceHandle&&le.data.sourceHandle.output_types)||[], ti=(le.data&&le.data.targetHandle&&le.data.targetHandle.inputTypes)||[];
    return { id:le.id||('fe_'+(++eidc)), source:le.source, target:le.target, type:so.find(x=>ti.includes(x))||so[0]||ti[0]||'*' };
  }).filter(e=>have.has(e.source)&&have.has(e.target));
  loadFlow({ nodes, edges });
  toast(t('lf_imported').replace('{n}',nodes.length).replace('{e}',edges.length));
}
function pickLangflowFile(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ importLangflowFlow(JSON.parse(r.result)); }catch(e){ toast(t('lf_bad')+': '+e.message); } }; r.readAsText(f); };
  inp.click(); }
function showAgentDraft(d){
  openModal({ title:t('gw_draft'), info:t('gw_addagent'), submitLabel:t('gw_addagent'),
    fields:[ {key:'name',label:'name',value:d.name||''}, {key:'skill',label:'skill',value:d.skill||'task'}, {key:'systemPrompt',label:'systemPrompt',type:'textarea',value:d.systemPrompt||''} ],
    onSubmit:async v=>{ if(!v.name) return; await api('/api/agents',{ name:v.name, skill:v.skill||'task', systemPrompt:v.systemPrompt||'', accepts:d.accepts||['*'], emits:d.emits||['*'] }); HIDDEN.delete(v.name); refresh(); toast('agent '+v.name); } });
}

/* ---------- modal + menu ---------- */
function openModal({title, fields=[], submitLabel='OK', onSubmit, info}){
  const dlg=$('#modal');
  dlg.innerHTML=`<form method="dialog"><div class="dh">${esc(title)}</div><div class="db">
    ${info?`<div class="minfo">${esc(info)}</div>`:''}
    ${fields.map(f=>`<label>${esc(f.label)}</label>`+(f.type==='textarea'?`<textarea data-k="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`
       : f.type==='readonly'?`<textarea data-k="${f.key}" readonly>${esc(f.value||'')}</textarea>`
       : `<input data-k="${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(f.value||'')}">`)).join('')}
    </div><div class="df"><button value="cancel" class="act">${t('cancel')}</button>${onSubmit?`<button value="ok" class="act ok">${esc(submitLabel)}</button>`:''}</div></form>`;
  dlg.showModal();
  dlg.querySelector('[value="cancel"]').onclick=()=>dlg.close();
  const ok=dlg.querySelector('[value="ok"]');
  if(ok) ok.onclick=(e)=>{ e.preventDefault(); const v={}; dlg.querySelectorAll('[data-k]').forEach(el=>v[el.dataset.k]=el.value); dlg.close(); onSubmit(v); };
  const first=dlg.querySelector('[data-k]'); if(first) setTimeout(()=>first.focus(),30);
}
function toggleMenu(e, id='autoMenu'){ e.stopPropagation(); const t=$('#'+id); document.querySelectorAll('.menu-pop.open').forEach(m=>{ if(m!==t) m.classList.remove('open'); }); t.classList.toggle('open'); }
function closeMenu(){ document.querySelectorAll('.menu-pop.open').forEach(m=>m.classList.remove('open')); }
document.addEventListener('click', e=>{ if(!e.target.closest('.menu')) closeMenu(); });

/* Langflow-style keyboard shortcuts */
// in-node settings: live-bind inline field widgets → component config. Text 'input' updates config WITHOUT a
// re-render (the focused element survives); selects/checkboxes commit on 'change' (kind switch / sub-flow ref / bool).
document.addEventListener('input', e=>{ const el=e.target; if(!el.matches)return;
  if(el.matches('textarea[data-noteid][data-notefield="text"]')){ const nt=noteOf(el.dataset.noteid); if(nt) nt.text=el.value; return; }   // B1 note text: live-bind while typing
  if(!el.matches('.nf[data-fk]')||el.tagName==='SELECT')return; const c=comp(el.dataset.nf); if(c) c.config[el.dataset.fk]=el.type==='checkbox'?el.checked:el.value; });
document.addEventListener('change', e=>{ const el=e.target; if(!el.matches)return;
  if(el.matches('[data-mcpnf]')){ const m=mcpn(el.dataset.mcpnf); if(!m)return;                // MCP server/tool cascade — shared by the card (.nf) and inspector (.cin)
    if(el.dataset.mcpserver){ el.blur(); return void onMcpServer(m, el.value); }               // A2: server picked → lazy-load its tools, re-render (blur first so the focus guard lets the tool select appear)
    if(el.dataset.mcptool) return setMcpTool(m, m.server, el.value);
    if(el.dataset.mcpauto){ m.auto=el.checked; return render(); }
    if(el.dataset.mcpargs){ try{ m.config=JSON.parse(el.value||'{}'); toast(t('t_args_ok')); }catch{ toast(t('t_badjson')); } return; } return; }
  if(el.matches('[data-trig]')){ const tr=trig(el.dataset.trig); if(!tr)return;                // B1 trigger card: event / status selects (drive tr.match like the old inspector)
    if(el.dataset.trigfield==='event'){ tr.match=el.value?{event:el.value}:{}; return render(); }   // switching the event resets stale fields (e.g. status)
    if(el.dataset.trigfield==='status'){ tr.match={...(tr.match||{})}; if(el.value) tr.match.status=el.value; else delete tr.match.status; return render(); } return; }
  if(el.matches('select[data-noteid][data-notefield="color"]')){ const nt=noteOf(el.dataset.noteid); if(nt){ nt.color=el.value; render(); } return; }   // B1 note color
  if(!el.matches('.nf[data-nf]'))return; const c=comp(el.dataset.nf); if(!c)return;
  if(el.dataset.kindsel){ return setCompKind(c, el.value); }                                   // inline kind selector → specialize the node
  c.config[el.dataset.fk]=el.type==='checkbox'?el.checked:el.value; if(el.dataset.rerender||el.type==='checkbox') render(); });
// B1/B2 — card-level buttons: chevron (fold) · note done · agent passport apply / trust preset
document.addEventListener('click', e=>{ const el=e.target.closest('[data-collapse],[data-notedone],[data-ppsave],[data-agpreset]'); if(!el)return;
  if(el.dataset.collapse!=null) toggleCollapse(el.dataset.collapse);
  else if(el.dataset.notedone!=null){ noteEdit=null; render(); }
  else if(el.dataset.ppsave!=null) saveAgentPassport(el.dataset.ppsave);
  else if(el.dataset.agpreset!=null) applyPreset(el.dataset.agpreset, el.dataset.preset); });
// B2 — apply the agent card's passport editor (caps + never) to the hub. Caps commit on this button (not on
// change) so each select doesn't fire an API round-trip + refresh that would fight the focus guard.
async function saveAgentPassport(id){ const card=document.getElementById('n_'+cssid(id)); if(!card)return;
  const caps={ secrets:'deny' }; card.querySelectorAll('select[data-cap]').forEach(s=>caps[s.dataset.cap]=s.value);
  const never=(card.querySelector('textarea[data-agnever]')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  await api(`/api/agents/${id}/passport`,{ caps, share:{ never } }); toast(t('h_pp_saved')); refresh(); }
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  if(e.key==='/' && !typing){ e.preventDefault(); $('#palSearch').focus(); return; }
  if(e.key==='Escape'){ if(wiring){ wiring=null; document.body.classList.remove('wiring'); $('#tempwire').removeAttribute('d'); } else if(selected) deselect(); return; }
  if((e.key==='Delete'||e.key==='Backspace') && !typing && selected){ e.preventDefault(); deleteSelected(); }
});
function deleteSelected(){ const id=selected; if(!id)return;
  if(trig(id)) removeTrigger(id); else if(mcpn(id)) removeMcpNode(id); else if(comp(id)) removeComp(id); else if(noteOf(id)) removeNote(id);
  else if(ag(id)){ HIDDEN.add(id); EDGES=EDGES.filter(e=>e.source!==id&&e.target!==id); deselect(); } }
applyChrome(); restorePanels(); restoreView(); refresh(); fetchIntegrations(); fetchWorkflows(); api('/api/mcp').then(m=>MCP=m).catch(()=>{}); api('/api/buildstate').then(b=>BUILDSTATE=b).catch(()=>{}); api('/api/capvocab').then(v=>CAPVOCAB=v).catch(()=>{}); setInterval(refresh, 1500); window.addEventListener('resize', ()=>drawLinks());
</script>

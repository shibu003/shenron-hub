<!doctype html>
<meta charset="utf-8">
<title>BuildHUD — cockpit</title>
<!-- Langflow-style visual flow-builder for the durable handoff hub. Left palette · top toolbar ·
     canvas · right inspector. Click a node to configure it. Drag the body to move, drag a port to
     wire (typed). Save/Run a flow, or turn a trigger→chain into an automation. JA/EN toggle (🌐).
     Zero-dep; the hub re-reads this file per GET / (edit + reload, no restart). -->
<style>
  :root { --bg:#0e1116; --panel:#161b22; --panel2:#1b2129; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --amber:#d29922; --blue:#58a6ff; --red:#f85149; --grey:#6e7681; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); overflow:hidden; }
  button { font:inherit; }
  #topbar { display:flex; align-items:center; gap:12px; height:48px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .brand { font-weight:600; font-size:14px; white-space:nowrap; } .brand span { color:var(--dim); font-weight:400; }
  #flowName { background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 10px; font:inherit; width:200px; }
  .tb-actions { display:flex; align-items:center; gap:8px; }
  .tb { border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:7px; padding:7px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .tb:hover { border-color:var(--blue); }
  .tb.primary { border-color:var(--blue); color:var(--blue); } .tb.go { border-color:var(--green); color:var(--green); }
  .tb.stop { border-color:var(--red); color:var(--red); } .tb.stop:hover { border-color:var(--red); background:rgba(248,81,73,.08); }
  .tb.collapse { border-color:#8957e5; color:#a371f7; } .tb.collapse:hover { border-color:#a371f7; background:rgba(137,87,229,.1); }
  .menu { position:relative; }
  .menu-pop { position:absolute; top:38px; right:0; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:5px; min-width:230px; z-index:30; box-shadow:0 12px 34px -12px #000; display:none; }
  .menu-pop.open { display:block; }
  .menu-pop button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:8px 10px; border-radius:6px; cursor:pointer; }
  .menu-pop button:hover { background:#0d1117; } .menu-pop .mh { color:var(--dim); font-size:11px; padding:6px 10px 2px; }
  #lang { margin-left:auto; } #conn { font-size:12px; color:var(--dim); min-width:70px; text-align:right; }
  #app { position:relative; display:grid; grid-template-columns:var(--palw,212px) 1fr var(--inspw,326px); height:calc(100vh - 49px); }
  .resizer { position:absolute; top:0; height:100%; width:8px; z-index:18; cursor:col-resize; }
  .resizer::after { content:''; position:absolute; top:0; left:3px; width:2px; height:100%; background:var(--line); transition:background .12s; }
  .resizer:hover::after, .resizer.drag::after { background:var(--blue); }
  #palResizer { left:var(--palw,212px); transform:translateX(-4px); }
  #inspResizer { right:var(--inspw,326px); transform:translateX(4px); }
  #palette { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; overflow:hidden; }
  .pal-head { padding:11px 13px 7px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  #palSearch { margin:0 11px 8px; background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 9px; font:inherit; }
  .pal-tip { margin:0 11px 9px; padding:8px 9px; border:1px solid #2a3440; border-radius:8px; background:#0f1620; color:#b8c7d8; font-size:11px; }
  .pal-tip b { color:var(--txt); }
  #palList { flex:1; overflow:auto; }
  .palrow { display:flex; align-items:center; gap:7px; padding:7px 11px; cursor:default; border-top:1px solid #20262d; }
  .palrow:hover { background:var(--panel2); }
  .palrow .pm { flex:1; min-width:0; } .palrow .pm b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; }
  .palrow .pm span { color:var(--dim); font-size:11px; }
  .palrow.trig .pm b { color:var(--amber); } .palrow.on { opacity:.5; }
  .palrow .pb { cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:1px 7px; color:var(--txt); background:#0d1117; }
  .palrow .pb:hover { border-color:var(--blue); }
  .pal-add { padding:9px 11px; border-top:1px solid var(--line); display:grid; gap:6px; }
  .pal-add input { background:#0d1117; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 8px; font:inherit; }
  .pal-add .row2 { display:flex; gap:6px; } .pal-add .row2 button { flex:1; }
  .pal-add button { border:1px solid var(--line); background:#0d1117; color:var(--txt); border-radius:7px; padding:6px; cursor:pointer; }
  .pal-add button:hover { border-color:var(--blue); }
  #canvas { position:relative; overflow:hidden; background-color:#08090c; cursor:grab; }
  #canvas.panning { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; width:6000px; height:4200px; transform-origin:0 0; will-change:transform;
           background-image:radial-gradient(circle at 1px 1px, #2b313a 1px, transparent 0); background-size:24px 24px; }
  svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  #zoomctl button { min-width:30px; height:26px; background:none; border:0; color:var(--txt); border-radius:6px; cursor:pointer; font:inherit; }
  #zoomctl button:hover { background:#0d1117; } #zoomctl #zoomPct { min-width:46px; color:var(--dim); font-size:11px; }
  svg .flow { stroke-dasharray:7 6; animation:dash .7s linear infinite; } @keyframes dash { to { stroke-dashoffset:-13; } }
  svg .hit { pointer-events:stroke; stroke:transparent; stroke-width:15; fill:none; cursor:pointer; }
  svg .tw { stroke-dasharray:6 5; opacity:.95; }

  #coach { position:absolute; left:18px; bottom:18px; width:min(430px, calc(100% - 36px)); z-index:4; }

  .legend { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; color:var(--dim); font-size:11px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line); border-radius:999px; padding:3px 8px; background:#0d1117; }

  .coach-actions { display:flex; gap:8px; align-items:center; }

  .coach-actions button:hover,.linkbtn:hover { background:#10233a; }
  .coach-actions small { color:var(--dim); line-height:1.35; }
  #wireTip { position:absolute; z-index:20; display:none; max-width:320px; pointer-events:none; background:#0d1117; border:1px solid var(--blue); border-radius:9px; color:var(--txt); padding:8px 10px; font-size:12px; box-shadow:0 12px 28px -18px #000; }
  #wireTip.ok { border-color:var(--green); color:#bdf6c9; }
  #wireTip.bad { border-color:var(--red); color:#ffc2be; }
  .node { position:absolute; width:200px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:0 0 9px; cursor:grab; user-select:none; box-shadow:0 2px 10px -3px rgba(0,0,0,.55); transition:border-color .12s, box-shadow .12s, transform .12s; }
  .node:hover { border-color:#48515c; box-shadow:0 12px 30px -12px rgba(0,0,0,.8); transform:translateY(-1px); }

  .node.trigger { width:188px; border-color:var(--amber); background:#1b1407; } .node.trigger .name { color:var(--amber); background:rgba(210,153,34,.14); }
  .node.mcp { width:200px; border-color:#2ea043; background:#0c1f12; } .node.mcp .name { color:#3fb950; background:rgba(46,160,67,.14); } .node.mcp .port { border-color:#2ea043; }
  .node.comp { width:200px; border-color:#8957e5; background:#150f23; } .node.comp .name { color:#a371f7; background:rgba(137,87,229,.16); } .node.comp .port { border-color:#8957e5; }
  .node.note { width:250px; cursor:grab; } .node.note .notebody { padding:11px 13px; font-size:12px; line-height:1.55; color:#cdd9e5; white-space:normal; max-height:280px; overflow:auto; }

  .port { position:absolute; width:15px; height:15px; border-radius:50%; background:#0d1117; border:2px solid var(--blue); top:50%; transform:translateY(-50%); cursor:crosshair; z-index:4; transition:transform .1s, box-shadow .12s; box-shadow:0 0 0 2px var(--panel); }
  .port.in { left:-11px; } .port.out { right:-11px; } .port:hover { transform:translateY(-50%) scale(1.2); box-shadow:0 0 0 4px rgba(230,237,243,.24); }
  .portlabel { position:absolute; top:50%; transform:translateY(-50%); color:#b8c7d8; font-size:9px; line-height:1; letter-spacing:.06em; background:#0d1117; border:1px solid #2f3d4c; border-radius:999px; padding:2px 5px; pointer-events:none; z-index:4; }
  .portlabel.in { right:calc(100% + 7px); left:auto; } .portlabel.out { left:calc(100% + 7px); right:auto; }
  .node.trigger .port.out { border-color:var(--amber); }

  .field .v { font-size:13px; } .chips { display:flex; flex-wrap:wrap; gap:5px; }

  #trustpanel { position:absolute; top:12px; right:12px; width:340px; max-height:calc(100% - 24px); overflow:auto; z-index:30;
    background:rgba(13,17,23,.97); border:1px solid var(--amber); border-radius:10px; padding:11px 12px; box-shadow:0 8px 30px rgba(0,0,0,.5); font-size:12px; }

  #trustpanel .tp-note { font-size:10px; color:var(--dim); margin-top:9px; line-height:1.4; }

function setPanelW(varName, w){ w=Math.max(0, Math.min(620, w)); if(w<56) w=0; $('#app').style.setProperty(varName, w+'px'); localStorage.setItem('bh'+varName, w); drawLinks(); }
function initResizer(id, varName, grow){            // grow:+1 → width follows cursor rightward (palette); -1 → leftward (inspector)
  const h=$('#'+id); if(!h) return;
  h.addEventListener('pointerdown', e=>{ e.preventDefault(); h.setPointerCapture?.(e.pointerId); h.classList.add('drag');
    const x0=e.clientX, w0=parseInt(getComputedStyle($('#app')).getPropertyValue(varName)) || (grow>0?212:326);
    const move=ev=> setPanelW(varName, w0 + grow*(ev.clientX-x0));
    const up=()=>{ h.classList.remove('drag'); document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); });
}

const clampZoom = (z) => Math.min(2.5, Math.max(.35, z));
function saveView(){ try{ localStorage.setItem('bh_view', JSON.stringify({ ZOOM, PANX, PANY })); }catch{} }
function setView(z, px, py){ ZOOM=clampZoom(z); PANX=px; PANY=py; applyView(); drawLinks(); saveView(); }
function zoomAt(z, clientX, clientY){ const r=$('#canvas').getBoundingClientRect(), sx=clientX-r.left, sy=clientY-r.top;
  z=clampZoom(z); const wx=(sx-PANX)/ZOOM, wy=(sy-PANY)/ZOOM; setView(z, sx-wx*z, sy-wy*z); }   // keep the world point under the cursor fixed
function zoomStep(d){ const r=$('#canvas').getBoundingClientRect(); zoomAt(ZOOM*(d>0?1.15:1/1.15), r.left+r.width/2, r.top+r.height/2); }
function resetView(){ setView(1, 0, 0); }
function fitView(){ const ns=[...$('#world').querySelectorAll('.node')]; if(!ns.length) return resetView();
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const n of ns){ x0=Math.min(x0,n.offsetLeft); y0=Math.min(y0,n.offsetTop); x1=Math.max(x1,n.offsetLeft+n.offsetWidth); y1=Math.max(y1,n.offsetTop+n.offsetHeight); }
  const r=$('#canvas').getBoundingClientRect(), pad=60, z=clampZoom(Math.min((r.width-pad*2)/(x1-x0||1),(r.height-pad*2)/(y1-y0||1),1.4));
  setView(z, pad-x0*z, pad-y0*z); }

  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'content-type':'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function compatibleAgents(a,b){
  if(!a||!b||a.id===b.id) return false;
  const e=a.emits||['*'], accepts=b.accepts||['*'];
  return e.includes('*')||accepts.includes('*')||e.some(x=>accepts.includes(x));
}
function exampleChain(){
  const agents=state.agents||[];
  let first=agents.find(a=>/sales|linkedin|prospect/i.test(`${a.id} ${a.skill||''}`));
  let second=agents.find(a=>/marketing|outreach|draft/i.test(`${a.id} ${a.skill||''}`) && a.id!==first?.id);
  if(!first) first=agents[0];
  if(first && (!second || !compatibleAgents(first,second))) second=agents.find(a=>compatibleAgents(first,a));
  return first&&second ? [first,second] : [];
}
function placeExampleFlow(){
  const pair=exampleChain(); if(pair.length<2) return toast(t('pal_empty'));
  const [a,b]=pair, trId='trigger-example';
  HIDDEN.delete(a.id); HIDDEN.delete(b.id);
  let tr=TRIGGERS.find(x=>x.id===trId);
  if(!tr){ tr={ id:trId, kind:'trigger', type:'build_state', match:{ event:'review_completed', status:'green' } }; TRIGGERS.unshift(tr); }
  POS[trId]={x:42,y:70}; POS[a.id]={x:300,y:70}; POS[b.id]={x:560,y:70};
  const add=(source,target)=>{ if(!EDGES.some(e=>e.source===source&&e.target===target)) EDGES.push({ id:'fe_'+(++eidc), source, target, type:matchType(source,target) }); };
  add(trId,a.id); add(a.id,b.id);
  selected=trId; render(); toast(t('demo_placed'));
}
// Wave C — the SKU's representative flow: a cross-owner handoff fenced by the trust bundle.
// Chat Input (with a secret + codename baked in) → upstream agent → [🔒 cross-company wire: never=codename]
// → downstream agent → approval-gated external send → Chat Output. Run it to see the firewall + audit fire.
function placeSafeHandoff(){
  const pair=exampleChain(); if(pair.length<2) return toast(t('pal_empty'));
  const [a,b]=pair;
  const send=[].concat(...(INTEGRATIONS||[]).filter(i=>i.enabled!==false).map(i=>(i.tools||[]).map(tl=>({server:i.id,tool:tl.name})))).find(x=>/send|email|message|post/i.test(x.tool));
  const baked='Draft outreach for our top prospect. Internal note: OPENAI_API_KEY=sk-live-DEMO1234567890ABCD; codename PROJECT-FALCON — do not share externally.';
  const nodes=[{id:'in1',kind:'input',config:{text:baked},x:30,y:90},
               {id:a.id,kind:'agent',agent:a.id,skill:a.skill,x:250,y:90},
               {id:b.id,kind:'agent',agent:b.id,skill:b.skill,x:470,y:90}];
  const edges=[{id:'fe_'+(++eidc),source:'in1',target:a.id},
               {id:'fe_'+(++eidc),source:a.id,target:b.id,share:{classes:['project'],never:['codename','PROJECT-','PROJECT-FALCON']}}];   // 🔒 cross-company wire
  if(send){ nodes.push({id:'send1',kind:'mcp',server:send.server,tool:send.tool,config:{},auto:false,x:690,y:90},{id:'out1',kind:'output',x:910,y:90});
    edges.push({id:'fe_'+(++eidc),source:b.id,target:'send1'},{id:'fe_'+(++eidc),source:'send1',target:'out1'}); }
  else { nodes.push({id:'out1',kind:'output',x:690,y:90}); edges.push({id:'fe_'+(++eidc),source:b.id,target:'out1'}); }
  loadFlow({nodes,edges}); toast(t('safe_placed'));
}
function addComp(kind){ const c=COMP[kind]; const id=(c?kind:'node')+'-'+(++cidc); const y=40+COMPONENTS.length*26;
  if(c){ const config={}; (c.fields||[]).forEach(f=>{ if(f.value!=null) config[f.key]=f.value; });
    COMPONENTS.push({ id, kind, accepts:c.accepts.slice(), emits:c.emits.slice(), config, x:200, y }); }
  else { COMPONENTS.push({ id, kind:'unset', accepts:['*'], emits:['*'], config:{}, x:200, y }); }   // blank node: choose the kind in the inspector
  selectNode(id); render(); }
// the node's ports change when its kind/中身 changes → drop wires that no longer type-match (and say so)
function revalidateEdges(id){ const before=EDGES.length;
  EDGES=EDGES.filter(e=>(e.source!==id&&e.target!==id)||canConnect(e.source,e.target));
  const dropped=before-EDGES.length; if(dropped) toast(t('t_edges_dropped').replace('{n}',dropped)); }
function setCompKind(cn, kind){ const m=COMP[kind];
  if(!m){ cn.kind='unset'; cn.accepts=['*']; cn.emits=['*']; return selectNode(cn.id); }
  cn.kind=kind; cn.accepts=m.accepts.slice(); cn.emits=m.emits.slice();
  const keepName=cn.config?.name, keepDesc=cn.config?.desc;                       // preserve the human name/desc across a kind change
  cn.config={}; (m.fields||[]).forEach(f=>{ if(f.value!=null) cn.config[f.key]=f.value; });
  if(keepName) cn.config.name=keepName; if(keepDesc) cn.config.desc=keepDesc;
  revalidateEdges(cn.id); selectNode(cn.id); }
function removeComp(id){ COMPONENTS=COMPONENTS.filter(c=>c.id!==id); EDGES=EDGES.filter(e=>e.source!==id&&e.target!==id); deselect(); }
function addMcpNode(tl){ const id='mcp-'+(++mnidc); const y=40+MCP_NODES.length*26;
  MCP_NODES.push(tl?{ id, kind:'mcp', server:tl.server, tool:tl.name, accepts:tl.accepts||['*'], emits:tl.emits||['*'], config:{}, auto:false, x:360, y }
                   :{ id, kind:'mcp', server:'', tool:'', accepts:['*'], emits:['*'], config:{}, auto:false, x:360, y });   // blank: choose the tool in the inspector
  selectNode(id); render(); }
// an mcp node with no tool bound is also "unconfigured" → guard run/save like an unset component
const NODE_UNSET = (n) => n.kind==='unset' || (n.kind==='mcp' && (!n.server || !n.tool)) || (n.kind==='workflow' && !n.ref);
function setMcpTool(mn, val){ if(!val) return;
  const [server,name]=val.split('::'); const it=(INTEGRATIONS||[]).find(x=>x.id===server); const tl=((it&&it.tools)||[]).find(x=>x.name===name);
  mn.server=server; mn.tool=name; mn.accepts=(tl&&tl.accepts)||['*']; mn.emits=(tl&&tl.emits)||['*'];
  revalidateEdges(mn.id); selectNode(mn.id); }
// rebind an agent node to a different registry agent, in place: keep this canvas slot's position + wiring,
// swap which agent it points at (hide the old, reveal the new), then re-validate ports. ("agent の中身変更")
function rebindAgent(oldId, newId){ if(!newId||newId===oldId) return;
  POS[newId]=POS[oldId]||POS[newId]||{x:60,y:60}; HIDDEN.delete(newId); HIDDEN.add(oldId);
  EDGES.forEach(e=>{ if(e.source===oldId) e.source=newId; if(e.target===oldId) e.target=newId; });
  revalidateEdges(newId); selectNode(newId); }

/* ---------- wiring ---------- */
function portPos(id, side){ const n=document.getElementById('n_'+cssid(id)); if(!n)return null; return { x: side==='out'? n.offsetLeft+n.offsetWidth : n.offsetLeft, y: n.offsetTop+n.offsetHeight/2 }; }

function canvasPt(e){ const r=$('#canvas').getBoundingClientRect(); return { x:(e.clientX-r.left-PANX)/ZOOM, y:(e.clientY-r.top-PANY)/ZOOM }; }   // screen → world (account for pan + zoom)
function canConnect(src,tgt){ if(!src||!tgt||src===tgt)return false; const tn=nodeOf(tgt); if(!tn||tn.kind==='trigger'||tn.kind==='note'||noteOf(src))return false;
  const e=nodeOf(src)?.emits||['*'], a=tn.accepts||['*']; return e.includes('*')||a.includes('*')||e.some(x=>a.includes(x)); }
function matchType(src,tgt){ const e=nodeOf(src)?.emits||['*'], a=nodeOf(tgt)?.accepts||['*'];
  const c=e.find(x=>x!=='*'&&a.includes(x)); if(c)return c; if(a.includes('*')) return e.find(x=>x!=='*')||'*'; if(e.includes('*')) return a.find(x=>x!=='*')||'*'; return '*'; }
function updateTemp(){ const tw=$('#tempwire'); if(!wiring){ tw.removeAttribute('d'); return; }
  const a=portPos(wiring.src,'out'); if(!a)return; const b=wiring.over?portPos(wiring.over,'in'):(wiring.pt||a);
  const ok=wiring.over?canConnect(wiring.src,wiring.over):null;
  tw.setAttribute('d', fpath(a,b)); tw.setAttribute('stroke-width','2'); tw.setAttribute('stroke', ok===true?'var(--green)':ok===false?'var(--red)':'var(--blue)'); }
function wireMessage(src,tgt){
  const s=nodeOf(src), target=nodeOf(tgt);
  if(!tgt) return t('wire_idle');
  if(src===tgt) return t('wire_same');
  if(!target || target.kind==='trigger') return t('wire_trigger_bad');
  if(canConnect(src,tgt)) return `${t('wire_ok')}: ${esc(src)} OUT → ${esc(tgt)} IN (${esc(matchType(src,tgt))})`;
  return `${t('wire_bad')}: ${t('wire_type_bad')} — OUT [${esc((s?.emits||['*']).join(', '))}] → IN [${esc((target.accepts||['*']).join(', '))}]`;
}
function showWireTip(e){

  const ok=wiring.over?canConnect(wiring.src,wiring.over):null;
  tip.className = ok===true ? 'ok' : ok===false ? 'bad' : '';
  tip.innerHTML = wireMessage(wiring.src,wiring.over);
  const r=$('#canvas').getBoundingClientRect(); tip.style.left=(e.clientX-r.left+16)+'px'; tip.style.top=(e.clientY-r.top+16)+'px'; tip.style.display='block';
}
function tryConnect(src,tgt){ if(!canConnect(src,tgt))return false; if(EDGES.some(x=>x.source===src&&x.target===tgt))return false;
  EDGES.push({ id:'fe_'+(++eidc), source:src, target:tgt, type:matchType(src,tgt) }); drawLinks(); return true; }
function startWire(e, src){ e.preventDefault(); e.stopPropagation(); wiring={ src, pt:canvasPt(e), over:null }; document.body.classList.add('wiring'); updateTemp(); showWireTip(e); }
function endWire(){ if(!wiring)return; if(wiring.over) tryConnect(wiring.src, wiring.over);
  wiring=null; document.body.classList.remove('wiring'); $('#tempwire').removeAttribute('d');
  $('#wireTip').style.display='none';
  document.querySelectorAll('.port.in').forEach(p=>p.classList.remove('valid','invalid')); }
document.addEventListener('pointermove', e=>{
  if(wiring){ wiring.pt=canvasPt(e);
    document.querySelectorAll('.port.in').forEach(p=>p.classList.remove('valid','invalid'));
    const inp=(document.elementFromPoint(e.clientX,e.clientY)||{}).closest?.('.port.in');
    if(inp){ const tt=inp.getAttribute('data-in'); wiring.over=tt; inp.classList.add(canConnect(wiring.src,tt)?'valid':'invalid'); } else wiring.over=null;
    updateTemp(); showWireTip(e); return; }

  if(panning){ const dx=e.clientX-panning.x, dy=e.clientY-panning.y; if(Math.abs(dx)+Math.abs(dy)>3) panning.moved=true;

});
document.addEventListener('pointerup', ()=>{ if(wiring) endWire(); if(nodeDrag){ const nd=nodeDrag; nodeDrag=null; if(!nd.moved){ nd.shift?toggleMulti(nd.id):selectNode(nd.id); } }

/* ---------- edges ---------- */
function center(id){ const n=document.getElementById('n_'+cssid(id)); if(!n)return null; return {x:n.offsetLeft+n.offsetWidth/2,y:n.offsetTop+n.offsetHeight/2}; }
function drawLinks(){
  const tp = TRUSTPREVIEW ? Object.fromEntries(TRUSTPREVIEW.wires.map(w=>[w.id,w])) : null;   // Wave E1: annotate wires with the dry-run
  const fe = EDGES.map(e=>{ const a=portPos(e.source,'out'), b=portPos(e.target,'in'); if(!a||!b)return '';
    const pw = tp ? tp[e.id] : null;
    const fenced = pw ? pw.fences.length>0 : !!(e.share&&((e.share.never||[]).length));        // Wave A/E1: this wire has a data-firewall policy
    const cnt = pw && pw.knownUpstream ? pw.previewRemoved.reduce((n,r)=>n+r.count,0) : null;   // concrete strip count from the dry-run
    const br = comp(e.source)?.kind==='router' ? (e.branch||'then') : null;                     // Wave E2: router branch label
    const lbl=(br?(br+': '):'')+(fenced?('🔒'+(cnt!=null?cnt:'')+' '):'')+esc(e.type), d=fpath(a,b), mx=(a.x+b.x)/2, my=(a.y+b.y)/2, w=Math.max(22, lbl.length*6+10), col=fenced?'var(--amber)':br?(br==='then'?'var(--blue)':'var(--grey)'):typeColor(e.type);
    const sel=selEdge===e.id?'<path d="'+d+'" fill="none" stroke="#fff" stroke-width="5" opacity=".25"/>':'';
    return sel+`<path d="${d}" fill="none" stroke="${col}" stroke-width="2" opacity=".85"${fenced?' stroke-dasharray="6 3"':''}/><path class="hit" d="${d}" data-edge="${e.id}"></path>`
      +`<rect x="${mx-w/2}" y="${my-9}" rx="5" width="${w}" height="16" fill="#0d1117" stroke="${col}"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="10" fill="${col}">${lbl}</text>`;
  }).join('');
  const he = state.handoffs.slice(-50).map(h=>{ const a=center(h.from),b=center(h.node||h.to); if(!a||!b)return '';
    const c=STC[h.status]||'var(--grey)'; const mx=(a.x+b.x)/2; const flow=FLOW.has(h.status);
    return `<path class="${flow?'flow':''}" d="M${a.x},${a.y} Q${mx},${a.y} ${mx},${(a.y+b.y)/2} T${b.x},${b.y}" fill="none" stroke="${c}" stroke-width="2" opacity="${h.status==='completed'?0.4:0.9}"/><circle cx="${b.x}" cy="${b.y}" r="3.5" fill="${c}"/>`;
  }).join('');
  $('#staticlinks').innerHTML = fe + he;
  $('#staticlinks').querySelectorAll('.hit').forEach(el=> el.onclick=()=> selectEdge(el.dataset.edge));   // Wave A: edge click → firewall editor (delete moved into the inspector)
}

// Wave E3 — run verdict: the after-run counterpart to E1's before-run dry-run. "Was this run safe, and why?"
// in one glance, joining the tamper-evident audit + run state for the LATEST run. The raw audit trail below
// becomes the evidence; this is the answer. All data already exists (/api/audit + /api/state).
function trustSummary(){
  const runs=state.runs||[]; if(!runs.length) return '';
  const run=runs[runs.length-1], runId=run.id;
  const hById={}; for(const h of state.handoffs) hById[h.id]=h;
  const inRun=e=> e.runId===runId || (e.handoff && hById[e.handoff] && hById[e.handoff].runId===runId);
  const ents=(AUDIT.entries||[]).filter(inRun);
  const leaks={}; let leakN=0;
  for(const e of ents.filter(x=>x.type==='redact')) for(const r of (e.removed||[])){ leaks[r.label]=(leaks[r.label]||0)+r.count; leakN+=r.count; }
  const sends=state.handoffs.filter(h=>h.runId===runId && h.mcp);
  const sent=sends.filter(h=>h.status==='completed').length, held=sends.filter(h=>h.status==='awaiting_approval').length;
  const blocked=ents.filter(e=>e.type==='deny').length + sends.filter(h=>h.status==='failed'||h.status==='rejected').length;
  const routes=ents.filter(e=>e.type==='route'), skipped=(run.skipped||[]).length;
  const verify=AUDIT.verify||{ok:true};
  const leakChips=Object.entries(leaks).map(([l,c])=>`<span class="ts-chip">${esc(l)}×${c}</span>`).join('')||`<span class="ts-clean">${t('ts_noleak')}</span>`;
  const routeRows=routes.map(e=>`<div class="ts-route">🔀 ${esc(e.node)} · ${esc(e.predicate)}=${e.result} → <b>${esc(e.branch)}</b></div>`).join('');
  return `<div class="tsum ${verify.ok?'ok':'bad'}">
    <div class="ts-h"><b>🔒 ${t('ts_title')}</b><span class="ts-run">#${esc(runId)} · ${esc(run.status)}</span><span class="ts-verify ${verify.ok?'ok':'bad'}">${verify.ok?t('aud_ok'):t('aud_bad')}</span></div>
    <div class="ts-line">${t('ts_stripped')} <b>${leakN}</b> · ${t('ts_sent')} <b>${sent}</b>${held?` · ${t('ts_held')} <b>${held}</b>`:''}${blocked?` · ${t('ts_blocked')} <b style="color:var(--red)">${blocked}</b>`:''}${skipped?` · ${t('ts_skipped')} <b>${skipped}</b>`:''}</div>
    <div class="ts-chips">${leakChips}</div>${routeRows}</div>`;
}
// Wave R — audit-backed reputation: the LONGITUDINAL counterpart to the per-run Trust verdict above. Aggregates
// the SAME tamper-evident audit per-agent across all runs into a transparent activity+integrity summary. The tier
// is just a label for the raw counts shown beside it; `denials` = "blocks enforced" (the firewall working, neutral).
// Data already on /api/state (state.reputation) — no extra fetch. repOf() is shared by the panel, palette chip,
// and agent inspector so the formatting lives in one place.
const REP_TONE = { verified:'allow', observed:'approval', new:'', 'chain-broken':'deny' };
function repOf(id){
  const r = state.reputation && state.reputation.agents && state.reputation.agents[id]; if(!r) return null;
  const tone = REP_TONE[r.tier] || '';
  const counts = [`${r.auditedRuns} ${t('rep_runs')}`,
    r.cleanRunRate!=null?`${t('rep_clean')} ${Math.round(r.cleanRunRate*100)}%`:null,
    r.redactionsCaught?`${t('rep_caught')} ${r.redactionsCaught}`:null,
    r.denials?`${t('rep_blocks')} ${r.denials}`:null,
    r.approvalsRequired?`${t('rep_approvals')} ${r.approvalsRequired}`:null].filter(Boolean).join(' · ');
  return { r, tone, label:t('rep_tier_'+(r.tier==='chain-broken'?'broken':r.tier)), score:r.score, counts, partial:r.attribution==='partial' };
}
function reputationPanel(){
  const rep=state.reputation; if(!rep||!rep.agents) return '';
  const ids=Object.keys(rep.agents); if(!ids.length) return '';
  const rows=ids.map(id=>({id, rp:repOf(id)})).filter(x=>x.rp)
    .sort((a,b)=> b.rp.r.auditedRuns-a.rp.r.auditedRuns || (b.rp.r.redactionsCaught+b.rp.r.denials)-(a.rp.r.redactionsCaught+a.rp.r.denials) || a.id.localeCompare(b.id))
    .map(({id,rp})=>`<div class="rep-row"><span class="capmini"><span class="${rp.tone}">${esc(id)} · ${rp.label}${rp.score!=null?` · ${rp.score}%`:''}</span></span>
      <div class="rep-meta">${rp.counts}${rp.partial?` · <i title="${t('rep_partial')}">~</i>`:''}</div></div>`).join('');
  const una = rep.unattributed && rep.unattributed.edgeRedactions ? `<div class="rep-meta" style="margin-top:6px">${t('rep_unattributed')}: ${rep.unattributed.edgeRedactions}</div>` : '';
  return `<div class="tsum rep ${rep.chainOk?'':'bad'}">
    <div class="ts-h"><b>📇 ${t('rep_title')}</b>${rep.chainOk?'':`<span class="ts-verify bad">${t('aud_bad')}</span>`}</div>
    ${rep.chainOk?'':`<div class="ts-line" style="color:var(--red)">${t('rep_chain_bad')}</div>`}
    ${rows}${una}<div class="rep-note">${t('rep_note')}</div></div>`;
}
function auditPanel(){
  const ents=AUDIT.entries||[]; const ok=!(AUDIT.verify&&AUDIT.verify.ok===false);
  const rows=ents.slice(-12).reverse().map(e=>`<div class="aud ${esc(e.type)}"><span class="atype">${esc(e.type)}</span><span class="adet">${esc(auditDetail(e))}</span></div>`).join('')||`<div class="empty">${t('aud_empty')}</div>`;
  return `<div class="ins-h" style="margin-top:16px">🔒 ${t('aud_head')}<span class="aud-v ${ok?'ok':'bad'}">${ok?t('aud_ok'):t('aud_bad')} · ${ents.length}</span></div>${rows}`;
}
function auditDetail(e){
  if(e.type==='redact') return `${e.egress?'→ ':''}${e.edge?'⟜'+e.edge+' ':''}${e.crossCompany?'⚠x-co ':''}${e.to||''}: ${(e.removed||[]).map(r=>r.label+'×'+r.count).join(', ')}`;
  if(e.type==='deny') return `${e.from||''} → ${e.to||''} — ${e.why||''}`;
  if(e.type==='send') return `${e.server||''}.${e.tool||''}${e.redacted?` (redacted ${e.redacted})`:''}`;
  if(e.type==='approve') return `${e.to||''} · ${e.skill||''}`;
  if(e.type==='passport'){ const c=e.caps||{}; return `${e.agent||''} net:${c.net||'?'} fs:${c.fs||'?'} send:${c.external_send||'?'}`; }
  if(e.type==='route') return `${e.node||''} ${e.predicate||''}=${e.result} → ${e.branch||''}`;
  return '';
}

function flowName(){ const v=$('#flowName').value.trim(); if(v) return v; const f=buildFlow(); return f? f.nodes.filter(n=>n.kind==='agent').map(n=>n.id.split('-')[0]).join('→') : 'flow'; }
function serialShare(share){ if(!share)return null; const s={}; const never=listClean(share.never), classes=listClean(share.classes);
  if(never.length) s.never=never; if(classes.length) s.classes=classes; return Object.keys(s).length?s:null; }
function nodeSpecOf(id){ const X=Math.round(POS[id]?.x||0), Y=Math.round(POS[id]?.y||0);   // one node → flow-schema spec (shared by buildFlow + buildSubflow)
  const tr=trig(id); if(tr) return { id, kind:'trigger', trigger:{type:tr.type, match:tr.match}, x:X, y:Y };
  const mn=mcpn(id); if(mn) return { id, kind:'mcp', server:mn.server, tool:mn.tool, config:mn.config||{}, auto:!!mn.auto, x:X, y:Y };
  const cn=comp(id); if(cn) return { id, kind:cn.kind, ...(cn.kind==='workflow'?{ref:cn.config?.ref||''}:{}), config:cn.config||{}, x:X, y:Y };
  const nt=noteOf(id); if(nt) return { id, kind:'note', text:nt.text||'', color:nt.color||'amber', x:X, y:Y };
  const a=ag(id); return { id, kind:'agent', agent:id, skill:a?.skill||'task', x:X, y:Y }; }
const edgeSpecOf=(e)=>{ const sh=serialShare(e.share); return { id:e.id, source:e.source, target:e.target, ...(sh?{share:sh}:{}), ...(e.branch?{branch:e.branch}:{}) }; };
function buildFlow(){ if(!EDGES.length) return null;
  const ids=new Set(); EDGES.forEach(e=>{ids.add(e.source);ids.add(e.target);});
  return { nodes:[...ids].map(nodeSpecOf).concat(NOTES.map(nt=>nodeSpecOf(nt.id))), edges:EDGES.map(edgeSpecOf) }; }   // notes are unwired → append them so they persist
function buildSubflow(ids, edges){ return { nodes:ids.map(nodeSpecOf), edges:edges.map(edgeSpecOf) }; }   // ③b-2: serialize a selected subset
// ③b-2 — collapse a (linear) multi-selection into one 📦 Sub-flow node: save the picked nodes + their internal
// edges as a workflow, drop a workflow node in their place, and rewire the external edges to it. Linear only —
// >1 external entry or >1 external exit is refused (ask for a linear chain). The new node runs as a nested run (③b).
async function collapseSelection(){
  if(selSet.size<2) return toast(t('t_collapse_min'));
  const S=selSet, ids=[...S];
  const internal=EDGES.filter(e=>S.has(e.source)&&S.has(e.target));
  const inExt=EDGES.filter(e=>S.has(e.target)&&!S.has(e.source));    // edges entering the selection from outside
  const outExt=EDGES.filter(e=>S.has(e.source)&&!S.has(e.target));   // edges leaving the selection to outside
  if(new Set(inExt.map(e=>e.target)).size>1 || new Set(outExt.map(e=>e.source)).size>1) return toast(t('t_collapse_linear'));
  const f=buildSubflow(ids, internal);
  if(f.nodes.some(NODE_UNSET)) return toast(t('t_unset'));
  let wf; try{ wf=await api('/api/workflows',{ name:(flowName()||'flow')+'-sub', nodes:f.nodes, edges:f.edges }); }catch(e){ return toast(e.message); }
  fetchWorkflows();
  const cx=Math.round(ids.reduce((s,id)=>s+(POS[id]?.x||0),0)/ids.length), cy=Math.round(ids.reduce((s,id)=>s+(POS[id]?.y||0),0)/ids.length);
  const wid='workflow-'+(++cidc);
  COMPONENTS.push({ id:wid, kind:'workflow', accepts:['*'], emits:['*'], config:{ ref:wf.id, name:wf.name } }); POS[wid]={x:cx,y:cy};
  inExt.forEach(e=>{ if(!EDGES.some(x=>x.source===e.source&&x.target===wid)) EDGES.push({ id:'fe_'+(++eidc), source:e.source, target:wid }); });
  outExt.forEach(e=>{ if(!EDGES.some(x=>x.source===wid&&x.target===e.target)) EDGES.push({ id:'fe_'+(++eidc), source:wid, target:e.target }); });
  EDGES=EDGES.filter(e=>!S.has(e.source)&&!S.has(e.target));   // drop the collapsed nodes' own edges (rewired ones survive — wid ∉ S)
  ids.forEach(id=>{ if(ag(id)) HIDDEN.add(id); else if(trig(id)) TRIGGERS=TRIGGERS.filter(x=>x.id!==id); else if(mcpn(id)) MCP_NODES=MCP_NODES.filter(x=>x.id!==id); else if(comp(id)) COMPONENTS=COMPONENTS.filter(x=>x.id!==id); });
  selSet.clear(); clearTrust(); selectNode(wid); toast(t('t_collapsed'));
}

// ⏹ Stop every in-flight run: the hub cancels the run (no more downstream firing) and rejects its paused/queued
// handoffs. In-process agents already mid-call can't be aborted, so they finish — but advance nothing further.
async function stopRun(){
  const active=(state.runs||[]).filter(r=>r.status==='running');
  if(!active.length) return toast(t('t_nostop'));
  for(const r of active){ try{ await api(`/api/runs/${encodeURIComponent(r.id)}/stop`,{}); }catch{} }
  toast(t('t_stopped')); conn(t('t_stopped')); refresh();
}

/* ---------- Ghost Writer (Wave L): NL → flow on the canvas. Generate, review, Run (fence intact). ---------- */
function ghostWrite(){
  openModal({ title:t('gw_title'), info:t('gw_info'), submitLabel:t('gw_btn'),
    fields:[{key:'prompt',label:'',type:'textarea',placeholder:t('gw_ph')}],
    onSubmit:async v=>{ const prompt=(v.prompt||'').trim(); if(!prompt) return;
      let r; try{ r=await api('/api/ghostwrite',{prompt}); }catch(e){ return toast(e.message||t('gw_empty')); }
      if(!r.nodes||!r.nodes.length) return toast(t('gw_empty'));
      loadFlow(r);
      const msg=`${t('gw_built')} (${r.source}, ${r.nodes.length} nodes)`+((r.warnings&&r.warnings.length)?` · ${t('gw_warn')}: ${r.warnings.length}`:'');
      conn(msg); toast(msg);
      if(r.agentDraft) showAgentDraft(r.agentDraft);
    } });
}
function loadFlow(flow){                          // materialize a generated/saved flow onto the canvas (fresh draft)
  TRIGGERS=[]; MCP_NODES=[]; COMPONENTS=[]; NOTES=[]; EDGES=[]; clearTrust();   // stale dry-run no longer matches the new draft
  HIDDEN.clear(); state.agents.forEach(a=>HIDDEN.add(a.id));   // hide all, then reveal the flow's agents
  for(const n of flow.nodes){
    POS[n.id]={ x:n.x||40, y:n.y||40 };
    if(n.kind==='agent'){ HIDDEN.delete(n.agent||n.id); }
    else if(n.kind==='trigger'){ TRIGGERS.push({ id:n.id, kind:'trigger', type:(n.trigger&&n.trigger.type)||'build_state', match:(n.trigger&&n.trigger.match)||{} }); }
    else if(n.kind==='mcp'){ MCP_NODES.push({ id:n.id, kind:'mcp', server:n.server, tool:n.tool, accepts:n.accepts||['*'], emits:n.emits||['*'], config:n.config||{}, auto:!!n.auto }); }
    else if(n.kind==='note'){ NOTES.push({ id:n.id, text:n.text||'', color:n.color||'amber' }); }
    else if(COMP[n.kind]){ const m=COMP[n.kind]; const config=n.config||{}; if(n.kind==='workflow'&&n.ref&&!config.ref) config.ref=n.ref; COMPONENTS.push({ id:n.id, kind:n.kind, accepts:m.accepts.slice(), emits:m.emits.slice(), config }); }
  }
  EDGES=(flow.edges||[]).map(e=>({ id:e.id||('fe_'+(++eidc)), source:e.source, target:e.target, type:e.type||matchType(e.source,e.target), ...(e.share?{share:e.share}:{}), ...(e.branch?{branch:e.branch}:{}) }));
  deselect(); render();
}
function showAgentDraft(d){

}

/* ---------- modal + menu ---------- */
function openModal({title, fields=[], submitLabel='OK', onSubmit, info}){
  const dlg=$('#modal');
  dlg.innerHTML=`<form method="dialog"><div class="dh">${esc(title)}</div><div class="db">
    ${info?`<div class="minfo">${esc(info)}</div>`:''}
    ${fields.map(f=>`<label>${esc(f.label)}</label>`+(f.type==='textarea'?`<textarea data-k="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea>`
       : f.type==='readonly'?`<textarea data-k="${f.key}" readonly>${esc(f.value||'')}</textarea>`
       : `<input data-k="${f.key}" placeholder="${esc(f.placeholder||'')}" value="${esc(f.value||'')}">`)).join('')}
    </div><div class="df"><button value="cancel" class="act">${t('cancel')}</button>${onSubmit?`<button value="ok" class="act ok">${esc(submitLabel)}</button>`:''}</div></form>`;
  dlg.showModal();
  dlg.querySelector('[value="cancel"]').onclick=()=>dlg.close();
  const ok=dlg.querySelector('[value="ok"]');
  if(ok) ok.onclick=(e)=>{ e.preventDefault(); const v={}; dlg.querySelectorAll('[data-k]').forEach(el=>v[el.dataset.k]=el.value); dlg.close(); onSubmit(v); };
  const first=dlg.querySelector('[data-k]'); if(first) setTimeout(()=>first.focus(),30);
}
function toggleMenu(e){ e.stopPropagation(); $('#autoMenu').classList.toggle('open'); }
function closeMenu(){ $('#autoMenu').classList.remove('open'); }
document.addEventListener('click', e=>{ if(!e.target.closest('.menu')) closeMenu(); });

/* Langflow-style keyboard shortcuts */
document.addEventListener('keydown', e=>{
  const tag=(e.target.tagName||'').toLowerCase(), typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  if(e.key==='/' && !typing){ e.preventDefault(); $('#palSearch').focus(); return; }
  if(e.key==='Escape'){ if(wiring){ wiring=null; document.body.classList.remove('wiring'); $('#tempwire').removeAttribute('d'); } else if(selected) deselect(); return; }
  if((e.key==='Delete'||e.key==='Backspace') && !typing && selected){ e.preventDefault(); deleteSelected(); }
});
function deleteSelected(){ const id=selected; if(!id)return;
  if(trig(id)) removeTrigger(id); else if(mcpn(id)) removeMcpNode(id); else if(comp(id)) removeComp(id); else if(noteOf(id)) removeNote(id);
  else if(ag(id)){ HIDDEN.add(id); EDGES=EDGES.filter(e=>e.source!==id&&e.target!==id); deselect(); } }

</script>

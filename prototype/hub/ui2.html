<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神龍 — canvas</title>
<!-- Canvas-only flow editor (ui2). Top toolbar · full-bleed canvas · ONE resizable right panel.
     Click a node → its settings open in the right panel (drag the splitter to resize, Zed-style).
     Drag a node body to move; drag from a node's rim to wire (typed). Add nodes from the ＋ menu.
     Trust / run-history / settings live elsewhere. Zero-dep; the hub re-reads this file per GET. -->
<style>
  :root { --bg:#0a0c10; --panel:#0c1822; --panel2:#0f1f2c; --line:#213e56; --txt:#c2d6e6; --dim:#6d8aa0;
          --green:#3fae7a; --amber:#c79338; --blue:#5b9bd1; --red:#c2554f; --grey:#5e84a0; --aiwire:#a371f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); overflow:hidden; }
  button { font:inherit; }
  #topbar { display:flex; align-items:center; gap:12px; height:48px; padding:0 14px; border-bottom:1px solid var(--line); background:var(--panel); overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
  #topbar::-webkit-scrollbar { display:none; }
  #topbar > * { flex:none; }   /* ツールバーが幅を超えても縮まず、横スクロールで届く */
  .brand { font-weight:600; font-size:14px; white-space:nowrap; } .brand span { color:var(--dim); font-weight:400; }
  #flowName { background:#0a121b; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:6px 10px; font:inherit; width:200px; }
  .tb-actions { display:flex; align-items:center; gap:8px; }
  .tb { border:1px solid var(--line); background:#0a121b; color:var(--txt); border-radius:7px; padding:7px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .tb:hover { border-color:var(--blue); }
  .tb.primary { border-color:var(--blue); color:var(--blue); } .tb.go { border-color:var(--green); color:var(--green); }
  .tb.stop { border-color:var(--red); color:var(--red); } .tb.stop:hover { border-color:var(--red); background:rgba(248,81,73,.08); }
  #ckptBadge { display:none; border:1px solid var(--amber); color:var(--amber); background:rgba(210,153,34,.12); border-radius:7px; padding:5px 11px; cursor:pointer; font:inherit; font-size:13px; white-space:nowrap; }
  #ckptBadge:hover { background:rgba(210,153,34,.22); }
  /* PC1: 計画モデル可否バッジ（🔴=plan が mode:unavailable になる＝PC0 相補） */
  #planBadge { display:none; align-items:center; border:1px solid var(--line); color:var(--dim); background:transparent; border-radius:7px; padding:5px 11px; cursor:default; font:inherit; font-size:13px; white-space:nowrap; }
  #planBadge.ok  { border-color:#3fb950; color:#3fb950; }
  #planBadge.bad { border-color:#f85149; color:#f85149; background:rgba(248,81,73,.12); }
  .tb.collapse { border-color:#8957e5; color:#a371f7; } .tb.collapse:hover { border-color:#a371f7; background:rgba(137,87,229,.1); }
  .flowgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; max-height:58vh; overflow:auto; }
  .flowcard { text-align:left; padding:10px; cursor:pointer; position:relative; } .flowcard:hover { border-color:var(--blue); } .fc-name { font-weight:600; margin-bottom:3px; }
  .fc-skill { position:absolute; top:6px; right:8px; cursor:pointer; opacity:.55; } .fc-skill:hover { opacity:1; }
  .menu { position:relative; }
  .menu-pop { position:absolute; top:38px; right:0; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:5px; min-width:230px; z-index:30; box-shadow:0 12px 34px -12px #000; display:none; }
  .menu-pop.open { display:block; }
  .menu-pop button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--txt); padding:8px 10px; border-radius:6px; cursor:pointer; }
  .menu-pop button:hover { background:#0a121b; } .menu-pop .mh { color:var(--dim); font-size:11px; padding:6px 10px 2px; }
  #conn { margin-left:auto; font-size:12px; color:var(--dim); min-width:70px; text-align:right; }
  /* ui2 layout: canvas grows · 6px drag-resizer · one right panel at a CSS-var width (Zed-style) */
  #main-wrap { display:flex; height:calc(100vh - 49px); overflow:hidden; }
  #canvas { flex:1; min-width:0; }
  #resizer { width:6px; flex:none; cursor:col-resize; position:relative; background:transparent; }
  #resizer::after { content:''; position:absolute; inset:0 2px; background:var(--line); transition:background .12s; }
  #resizer:hover::after, #resizer.drag::after { background:var(--blue); }
  #panel { width:var(--panelw,320px); flex:none; background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:14px; }
  #canvas { position:relative; overflow:hidden; background-color:#06090d; cursor:grab; touch-action:none; }
  #canvas.panning { cursor:grabbing; }
  #world { position:absolute; top:0; left:0; width:6000px; height:4200px; transform-origin:0 0; will-change:transform;
           background-image:radial-gradient(circle at 1px 1px, #1a3550 1px, transparent 0); background-size:24px 24px; }
  svg.links { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #zoomctl { position:absolute; right:12px; bottom:14px; z-index:25; display:flex; gap:4px; background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:3px; box-shadow:0 8px 24px -10px #000; }
  #zoomctl button { min-width:30px; height:26px; background:none; border:0; color:var(--txt); border-radius:6px; cursor:pointer; font:inherit; }
  #zoomctl button:hover { background:#0a121b; } #zoomctl #zoomPct { min-width:46px; color:var(--dim); font-size:11px; }
  svg .flow { stroke-dasharray:7 6; animation:dash .7s linear infinite; } @keyframes dash { to { stroke-dashoffset:-13; } }
  svg .hit { pointer-events:stroke; stroke:transparent; stroke-width:15; fill:none; cursor:pointer; }
  svg .tw { stroke-dasharray:6 5; opacity:.95; }
  /* empty-canvas onboarding card (centered; shown only when no nodes are placed) */
  #hint { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); display:none; flex-direction:column; gap:12px; align-items:center; text-align:center;
          background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px 30px; max-width:430px; box-shadow:0 20px 60px -20px #000; z-index:6; }
  #hint .ec-h { font-size:18px; font-weight:700; }
  #hint .ec-b { color:var(--dim); font-size:13px; line-height:1.6; }
  #hint .ec-act { display:flex; gap:10px; margin-top:4px; }
  #wireTip { position:absolute; z-index:20; display:none; max-width:320px; pointer-events:none; background:#0a121b; border:1px solid var(--blue); border-radius:9px; color:var(--txt); padding:8px 10px; font-size:12px; box-shadow:0 12px 28px -18px #000; }
  #wireTip.ok { border-color:var(--green); color:#bdf6c9; }
  #wireTip.bad { border-color:var(--red); color:#ffc2be; }
  /* per-node dynamic sizing — width fits content within [min,max]; height grows with the in-card settings */
  .node { position:absolute; width:fit-content; min-width:200px; max-width:340px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
          padding:0 0 9px; cursor:grab; user-select:none; box-shadow:0 2px 10px -3px rgba(0,0,0,.55); transition:border-color .12s, box-shadow .12s, transform .12s; }
  .node:hover { border-color:#2a5575; box-shadow:0 12px 30px -12px rgba(0,0,0,.8); transform:translateY(-1px); z-index:7; }   /* overlap: raise the hovered node */
  .node.selected { border-color:var(--blue); box-shadow:0 0 0 1px var(--blue), 0 8px 22px -10px var(--blue); z-index:8; }
  /* C1 floating wiring — drag from a node's rim to connect (any side); drop target highlights */
  body:not(.wiring) .node:hover { outline:1px dashed rgba(88,166,255,.45); outline-offset:3px; }   /* hint: the rim is draggable to connect */
  .node.wtarget { outline:2px solid var(--green); outline-offset:2px; }
  .node.wbad { outline:2px solid var(--red); outline-offset:2px; }
  .node.multi { box-shadow:0 0 0 2px var(--amber), 0 8px 22px -10px rgba(210,153,34,.6); }   /* ③b-2 shift-click multi-select */
  .node.busy { border-color:var(--blue); animation:busy 1.1s ease-in-out infinite; }
  @keyframes busy { 50% { box-shadow:0 0 14px -2px var(--blue), 0 0 0 1px var(--blue) inset; } }
  .node .name { font-weight:600; display:flex; align-items:center; gap:7px; padding:9px 12px; border-bottom:1px solid var(--line); border-radius:13px 13px 0 0; background:rgba(255,255,255,.022); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--grey); flex:none; }
  .dot.on { background:var(--green); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(63,185,80,.6);} 50%{ box-shadow:0 0 0 5px rgba(63,185,80,0);} }
  .node .co { color:var(--dim); font-size:11px; margin:0; padding:6px 12px 0; }
  /* kind chip — names the node category at a glance (色は枠と連動) */
  .kindchip { display:inline-block; font-size:9px; line-height:1.5; letter-spacing:.03em; border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-right:6px; color:var(--dim); vertical-align:middle; }
  .kindchip.ag { border-color:#3a4250; color:#aab8c6; }
  .kindchip.mcp { border-color:#2ea043; color:#3fb950; }
  .kindchip.comp { border-color:#6f42c1; color:#a371f7; }
  /* W2: icon color tile + per-kind accent — 種別をタイル色で即認識（icon は currentColor 駆動ゆえ tile の color で再着色） */
  .icontile { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:7px; flex:none; }
  .icontile svg { width:18px; height:18px; }   /* 14→18 拡大は CSS で（NI 呼び出しは触らない＝Haiku-safe） */
  .node.agent .icontile { background:rgba(194,214,230,.14); color:#c2d6e6; }
  .node.trigger .icontile { background:rgba(199,147,56,.20); color:#e0a93a; }
  .node.mcp .icontile { background:rgba(46,160,67,.18); color:#3fb950; }
  .node.comp .icontile { background:rgba(137,87,229,.16); color:#a371f7; }   /* default comp（unset 含む） */
  .node.comp[data-kind="input"] .icontile, .node.comp[data-kind="output"] .icontile { background:rgba(0,179,179,.16); color:#22b3b3; }
  .node.comp[data-kind="model"]   .icontile { background:rgba(163,113,247,.18); color:#a371f7; }
  .node.comp[data-kind="parser"]  .icontile { background:rgba(63,174,122,.18); color:#3fae7a; }
  .node.comp[data-kind="router"]  .icontile { background:rgba(217,119,30,.20); color:#d9771e; }
  .node.comp[data-kind="workflow"] .icontile { background:rgba(79,70,229,.20); color:#7c7cf0; }
  .node.comp[data-kind="langflow"] .icontile { background:rgba(236,72,153,.18); color:#ec4899; }
  .node.trigger { border-top-left-radius:24px; border-bottom-left-radius:24px; }   /* W2: D字シルエット＝自動起点を形で認識 */
  .node .badge { margin-left:auto; background:#0a121b; border:1px solid var(--line); border-radius:999px; padding:1px 8px; font-size:11px; }
  .node .pol { font-size:10px; color:var(--dim); margin-top:6px; padding:0 12px; } .node .pol.auto { color:var(--amber); }
  .node.trigger { min-width:204px; border-color:var(--amber); background:#1b1407; } .node.trigger .name { color:var(--amber); background:rgba(210,153,34,.14); }
  .node.mcp { min-width:240px; border-color:#2ea043; background:#0c1f12; } .node.mcp .name { color:#3fb950; background:rgba(46,160,67,.14); } .node.mcp .port { border-color:#2ea043; }
  .node.comp { min-width:244px; border-color:#8957e5; background:#150f23; } .node.comp .name { color:#a371f7; background:rgba(137,87,229,.16); } .node.comp .port { border-color:#8957e5; }
  /* W4: AI 補助 kind（model/parser）= n8n 式 円サブノード。consumer 底辺の ◆ へ破線で上向き接続（drawLinks の vpath）＝「この部品が使う AI」を形で示す */
  .node.comp.ai { width:104px; min-width:104px; max-width:104px; height:104px; border-radius:50%; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .node.comp.ai .aibody { display:flex; flex-direction:column; align-items:center; gap:6px; padding:0 12px; text-align:center; }
  .node.comp.ai .ailabel { font-size:11px; font-weight:600; color:#a371f7; max-width:84px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .node.comp.ai .port.out:hover { transform:translate(-50%,-50%) scale(1.2); }   /* keep the top-center OUT centered on hover (override .port:hover translateY) */
  /* per-node collapse (B1): fold the settings body via the header chevron */
  .ntoggle { cursor:pointer; color:var(--dim); font-size:11px; line-height:1; padding:0 1px; user-select:none; flex:none; }
  .ntoggle:hover { color:var(--txt); }
  .node.collapsed .nbody { display:none; }
  .node.collapsed.mcp .name, .node.collapsed.comp .name, .node.collapsed.agent .name { border-bottom:none; border-radius:13px; }
  /* agent card holds the capability passport editor (B2) — fixed width (it's a form; only height is dynamic) */
  .node.agent { width:248px; } .node.agent .name { color:#c2d6e6; background:rgba(255,255,255,.03); }
  .node.agent .co { white-space:normal; }
  .node.agent .nbody .presetrow { display:flex; gap:5px; flex-wrap:wrap; }
  .node.agent .nbody .presetrow button { flex:1; min-width:62px; font-size:10px; padding:4px 5px; background:#0a121b; border:1px solid var(--line); border-radius:6px; color:var(--txt); cursor:pointer; }
  .node.agent .nbody .presetrow button:hover { border-color:var(--blue); }
  .node.agent .nbody .ibtn { width:100%; box-sizing:border-box; }
  /* in-node settings — edit a component's fields directly on the card (Langflow-style) */
  .nbody { padding:8px 11px 2px; display:grid; gap:7px; }
  .nfrow { display:grid; gap:2px; }
  .nflabel { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .nf { width:100%; box-sizing:border-box; background:#0a121b; border:1px solid var(--line); border-radius:6px; color:var(--txt); padding:4px 7px; font:11px/1.35 ui-monospace,Menlo,monospace; }
  .nf:focus { border-color:var(--blue); outline:none; box-shadow:0 0 0 2px rgba(88,166,255,.25); }
  textarea.nf { resize:vertical; min-height:36px; }
  select.nf.nkind { font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-weight:600; }
  .nfbool { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--txt); cursor:pointer; } .nfbool input { width:auto; }
  .nfres { font-size:11px; color:var(--green); white-space:pre-wrap; max-height:96px; overflow:auto; border-top:1px solid var(--line); padding-top:5px; }
  .node.note { min-width:230px; max-width:300px; cursor:grab; } .node.note .notebody { padding:11px 13px; font-size:12px; line-height:1.55; color:#c2d6e6; white-space:normal; max-height:280px; overflow:auto; }
  .node.note .notebody b { color:#fff; }
  .port { position:absolute; width:15px; height:15px; border-radius:50%; background:#0a121b; border:2px solid var(--blue); top:50%; transform:translateY(-50%); cursor:crosshair; z-index:4; transition:transform .1s, box-shadow .12s; box-shadow:0 0 0 2px var(--panel); }
  .port.in { left:-11px; } .port.out { right:-11px; } .port:hover { transform:translateY(-50%) scale(1.2); box-shadow:0 0 0 4px rgba(230,237,243,.24); }
  /* S1 (n8n化): input port = rounded rectangle tab (left); output port keeps the round dot (right) */
  .port.in { width:7px; height:16px; border-radius:3px; left:-7px; background:var(--line); cursor:crosshair; }
  .port.in:hover { transform:translateY(-50%) scale(1.15); }
  .portlabel { position:absolute; top:50%; transform:translateY(-50%); color:#9cbdd6; font-size:9px; line-height:1; letter-spacing:.06em; background:#0a121b; border:1px solid #213e56; border-radius:999px; padding:2px 5px; pointer-events:none; z-index:4; }
  .portlabel.in { right:calc(100% + 7px); left:auto; } .portlabel.out { left:calc(100% + 7px); right:auto; }
  .node.trigger .port.out { border-color:var(--amber); }
  .port.in.valid { border-color:var(--green); background:var(--green); box-shadow:0 0 0 4px rgba(63,185,80,.22); }
  .port.in.invalid { border-color:var(--red); background:var(--red); box-shadow:0 0 0 4px rgba(248,81,73,.22); }
  /* W3: ＋ Add-node affordance on a dangling OUT port (n8n) — sits just right of the OUT dot */
  .addnext { position:absolute; right:-34px; top:50%; transform:translateY(-50%); width:20px; height:20px; border-radius:50%; background:var(--panel2); border:1px dashed var(--line); color:var(--dim); display:flex; align-items:center; justify-content:center; font-size:15px; line-height:1; cursor:pointer; z-index:4; }
  .addnext:hover { border-color:var(--blue); color:var(--blue); }
  body.wiring, body.wiring .node { cursor:crosshair; }

  /* tier badge */
  .tier-badge { font-size:10px; padding:1px 6px; border-radius:999px; margin-left:auto; flex-none; }
  .tier-badge.cheap { background:rgba(63,185,80,.15); color:var(--green); border:1px solid #2ea043; }
  .tier-badge.strong { background:rgba(88,166,255,.15); color:var(--blue); border:1px solid #2a5a9e; }

  .ins-h { font-size:14px; font-weight:700; color:var(--txt); margin:0 0 14px; padding-bottom:10px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .ins-h .back { margin-left:auto; cursor:pointer; color:var(--blue); text-transform:none; letter-spacing:0; }
  .field { margin-bottom:11px; } .field label { display:block; font-size:11px; color:var(--dim); margin-bottom:3px; }
  .field .v { font-size:13px; } .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { background:#0a121b; border:1px solid var(--line); border-radius:999px; padding:1px 9px; font-size:11px; color:var(--txt); }
  .ibtn { width:100%; text-align:left; border:1px solid var(--line); background:#0a121b; color:var(--txt); border-radius:7px; padding:8px 11px; cursor:pointer; margin-bottom:7px; display:flex; align-items:center; gap:8px; }
  .ibtn:hover { border-color:var(--blue); } .ibtn.danger:hover { border-color:var(--red); color:var(--red); }
  .ibtn.toggle.auto { border-color:var(--amber); color:var(--amber); } .ibtn.toggle.approval { border-color:var(--blue); color:var(--blue); }
  textarea.match { width:100%; background:#0a121b; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:7px 9px; font:12px/1.4 ui-monospace,Menlo,monospace; min-height:64px; resize:vertical; }
  input.cin, select.cin { width:100%; box-sizing:border-box; background:#0a121b; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:7px 9px; font:12px/1.4 ui-monospace,Menlo,monospace; }
  .node.skipped { opacity:.32; filter:grayscale(1); }
  .h { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:7px; background:var(--panel2); cursor:pointer; }
  .h .top { display:flex; align-items:center; gap:7px; font-size:12px; }
  .h .who { color:var(--dim); } .h .who b { color:var(--txt); } .h .time { margin-left:auto; color:var(--dim); font-size:11px; }
  .st { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid; }
  .st.submitted{color:var(--grey);border-color:var(--grey)} .st.awaiting_approval{color:var(--amber);border-color:var(--amber)}
  .st.approved,.st.running{color:var(--blue);border-color:var(--blue)} .st.completed{color:var(--green);border-color:var(--green)}
  .st.failed,.st.rejected{color:var(--red);border-color:var(--red)}
  .h .body { font-size:12px; color:var(--dim); margin-top:6px; white-space:pre-wrap; max-height:120px; overflow:auto; }
  .h.open .body { max-height:none; } .h .acts { display:flex; gap:6px; margin-top:7px; }
  button.act { font-size:12px; border-radius:6px; border:1px solid var(--line); padding:4px 11px; cursor:pointer; background:#0a121b; color:var(--txt); }
  button.ok { border-color:var(--green); color:var(--green); } button.no { border-color:var(--red); color:var(--red); }
  .ckpt { margin-top:8px; } .ckpt-label { font-size:12px; color:var(--amber); margin-bottom:6px; word-break:break-all; }
  .ckpt-img { max-width:100%; border:1px solid var(--line); border-radius:6px; display:block; }
  .empty { color:var(--dim); font-size:12px; padding:10px 2px; }
  .mini { font-size:11px; color:var(--dim); margin-top:2px; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:12px; width:460px; padding:0; }
  dialog .dh { padding:13px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  dialog .db { padding:14px 16px; display:grid; gap:9px; } dialog label { font-size:12px; color:var(--dim); }
  dialog .minfo { font-size:12px; color:var(--dim); }
  dialog input, dialog textarea { width:100%; background:#0a121b; border:1px solid var(--line); border-radius:7px; color:var(--txt); padding:8px 10px; font:inherit; }
  dialog textarea { min-height:88px; resize:vertical; font:12px/1.4 ui-monospace,Menlo,monospace; }
  dialog textarea[readonly] { min-height:62px; }
  dialog .df { display:flex; gap:8px; justify-content:flex-end; padding:0 16px 14px; }
  ::backdrop { background:rgba(0,0,0,.55); }

function setPanelW(w){

function initPanelResizer(){

  h.addEventListener('pointerdown', e=>{
    e.preventDefault(); try{ h.setPointerCapture?.(e.pointerId); }catch{} h.classList.add('drag');
    const startX = e.clientX;                                    // cursor x when the drag began
    const startW = $('#panel').getBoundingClientRect().width;    // panel width when the drag began

    const move = ev => setPanelW(startW + (startX - ev.clientX));

const WIRE_EDGE=13;   // px-from-border zone that starts a wire instead of a move
function attachNode(n, id){
  n.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('.addnext')) return;   // W3: ＋ has its own click handler (delegated on #world) — don't start a wire/drag
    // S1 (n8n化): the OUT port (right dot) is the primary wire start; the IN port (left tab) is a drop target only.
    if(!wiring && e.target.closest('.port.out') && !noteOf(id)) return startWire(e, id);
    if(e.target.closest('.port.in')) return;   // input ports don't start a drag (drop zone is the whole node, L810)
    if(e.target.closest('input,textarea,select,label,button,.nf,.ntoggle'))return;   // widgets handle themselves
    // rim-drag fallback (backward compatible): drag from any of the node's 4 edges to start a wire; the temp-wire
    // floats to whichever border faces the target. Top rim is thin (7px) so the header title stays grabbable.
    const r=n.getBoundingClientRect();
    const nearRim = (e.clientY-r.top<7)||(r.bottom-e.clientY<WIRE_EDGE)||(e.clientX-r.left<WIRE_EDGE)||(r.right-e.clientX<WIRE_EDGE);
    if(!wiring && nearRim && !noteOf(id)) return startWire(e, id);
    if(wiring) return;
    e.preventDefault(); const p=canvasPt(e); const o=POS[id]||{x:n.offsetLeft,y:n.offsetTop};
    nodeDrag={ id, node:n, offX:p.x-o.x, offY:p.y-o.y, moved:false, shift:e.shiftKey, preSnap:canvasSnap() };
  });
  n.addEventListener('contextmenu', e=>showCtxMenu(e, id));
}

// whichever side faces the other node (top/right/bottom/left), instead of a fixed left-in / right-out port.
function borderPoint(id, tx, ty){ const r=nodeRect(id); if(!r)return null;
  const dx=tx-r.cx, dy=ty-r.cy; if(!dx&&!dy) return { x:r.cx, y:r.cy };

  return { x:r.cx+dx*s, y:r.cy+dy*s }; }
// S1: fixed ports — source end exits the RIGHT edge mid-height, target end enters the LEFT edge mid-height.
// A router source splits its outgoing edges into two lanes on the right edge: then=upper / else=lower (e.branch).
function endpointPos(e, end){
  const id = end==='src' ? e.source : e.target;
  const r = nodeRect(id); if(!r) return center(id);
  const aiv = AI_AUX.has(comp(e.source)?.kind);   // W4: source が AI 円サブノード → 縦接続（src=上端中央 / tgt=consumer 底辺中央の◆）。router(非 AI_AUX)とは kind が排他
  if(end==='src'){
    if(aiv) return { x:r.x+r.w/2, y:r.y };                                    // AI サブノード: 上端中央から出力
    const br = comp(e.source)?.kind==='router' ? (e.branch||'then') : null;   // same router test as drawLinks
    const fy = br ? (br==='else'?0.72:0.28) : 0.5;                            // then=upper lane / else=lower lane
    return { x:r.x+r.w, y:r.y+r.h*fy };
  }
  if(aiv) return { x:r.x+r.w/2, y:r.y+r.h };                                  // consumer: 底辺中央の◆で受ける
  return { x:r.x, y:r.y+r.h/2 };
}
function fpath(a,b){ const dx=Math.max(36, Math.abs(b.x-a.x)*0.5); return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`; }
function vpath(a,b){ const dy=Math.max(36, Math.abs(b.y-a.y)*0.5); return `M${a.x},${a.y} C${a.x},${a.y-dy} ${b.x},${b.y+dy} ${b.x},${b.y}`; }   // W4: AI 供給の縦 bezier（a=円サブノード上端→上方向, b=consumer 底辺◆→下方向）
function canvasPt(e){ const r=$('#canvas').getBoundingClientRect(); return { x:(e.clientX-r.left-PANX)/ZOOM, y:(e.clientY-r.top-PANY)/ZOOM }; }   // screen → world (account for pan + zoom)
function canConnect(src,tgt){ if(!src||!tgt||src===tgt)return false; const tn=nodeOf(tgt); if(!tn||tn.kind==='trigger'||tn.kind==='note'||noteOf(src))return false;

  const c=e.find(x=>x!=='*'&&a.includes(x)); if(c)return c; if(a.includes('*')) return e.find(x=>x!=='*')||'*'; if(e.includes('*')) return a.find(x=>x!=='*')||'*'; return '*'; }

  const a=borderPoint(wiring.src, tip.x, tip.y); if(!a)return;
  const b=wiring.over?borderPoint(wiring.over, sc.x, sc.y):(wiring.pt||a);

  const s=nodeOf(src), target=nodeOf(tgt);

  if(canConnect(src,tgt)) return `${t('wire_ok')}: ${esc(src)} OUT → ${esc(tgt)} IN (${esc(matchType(src,tgt))})`;
  return `${t('wire_bad')}: ${t('wire_type_bad')} — OUT [${esc((s?.emits||['*']).join(', '))}] → IN [${esc((target.accepts||['*']).join(', '))}]`;
}

  const fe = EDGES.map(e=>{ const a=endpointPos(e,'src'), b=endpointPos(e,'tgt'); if(!a||!b)return '';
    const pw = tp ? tp[e.id] : null;
    const fenced = pw ? pw.fences.length>0 : !!(e.share&&((e.share.never||[]).length));        // Wave A/E1: this wire has a data-firewall policy
    const cnt = pw && pw.knownUpstream ? pw.previewRemoved.reduce((n,r)=>n+r.count,0) : null;   // concrete strip count from the dry-run
    const br = comp(e.source)?.kind==='router' ? (e.branch||'then') : null;                     // Wave E2: router branch label
    const ai = !fenced && !br && isAiEdge(e);                                                    // W1: AI 補助 edge（fenced/router 分岐より下位＝可読性で分岐構造を勝たせる）
    const aiv = ai && AI_AUX.has(comp(e.source)?.kind);                                          // W4: source が AI 円サブノード → 縦 vpath＋◆（矢印なし・上→下供給）。fenced/router 下位は ai 経由で継承
    const lbl=(br?(br+': '):'')+(fenced?(''+(cnt!=null?cnt:'')+' '):'')+esc(e.type), d=aiv?vpath(a,b):fpath(a,b), mx=(a.x+b.x)/2, my=(a.y+b.y)/2, w=Math.max(22, lbl.length*6+10), col=fenced?'var(--amber)':br?(br==='then'?'var(--blue)':'var(--grey)'):ai?'var(--aiwire)':typeColor(e.type);
    const sel=selEdge===e.id?'<path d="'+d+'" fill="none" stroke="#fff" stroke-width="5" opacity=".25"/>':'';
    return sel+`<path d="${d}" fill="none" stroke="${col}" stroke-width="2" opacity=".85"${aiv?'':' marker-end="url(#arrow)"'}${fenced?' stroke-dasharray="6 3"':ai?' stroke-dasharray="5 5"':''}/><path class="hit" d="${d}" data-edge="${e.id}"></path>`
      +`<circle cx="${a.x}" cy="${a.y}" r="3.5" fill="#0a121b" stroke="${col}" stroke-width="2"/>`
      +(aiv?`<rect x="${b.x-5}" y="${b.y-5}" width="10" height="10" transform="rotate(45 ${b.x} ${b.y})" fill="#0a121b" stroke="var(--aiwire)" stroke-width="2"/>`:'')
      +`<rect x="${mx-w/2}" y="${my-9}" rx="5" width="${w}" height="16" fill="#0a121b" stroke="${col}"/><text x="${mx}" y="${my+3}" text-anchor="middle" font-size="10" fill="${col}">${lbl}</text>`;
  }).join('');
  const he = state.handoffs.slice(-50).map(h=>{ const a=center(h.from),b=center(h.node||h.to); if(!a||!b)return '';

  }).join('');
  $('#staticlinks').innerHTML = fe + he;
  $('#staticlinks').querySelectorAll('.hit').forEach(el=> el.onclick=()=> selectEdge(el.dataset.edge));   // Wave A: edge click → firewall editor (delete moved into the inspector)

const ARTIFACT_SHIM = `<script>(function(){var _f=window.fetch,_p={},_i=0;window.addEventListener('message',function(e){var d=e.data;if(d&&(d.type==='art-res'||d.type==='art-flow-res')&&_p[d.id]){_p[d.id](d);delete _p[d.id];}});window.shenron={approve:function(){return new Promise(function(res,rej){var id=++_i;_p[id]=function(d){d.error?rej(new Error(d.error)):res(d.data);};window.parent.postMessage({type:'art-approve',id:id},'*');});},decline:function(){return new Promise(function(res,rej){var id=++_i;_p[id]=function(d){d.error?rej(new Error(d.error)):res(d.data);};window.parent.postMessage({type:'art-decline',id:id},'*');});},advance:function(data){return new Promise(function(res,rej){var id=++_i;_p[id]=function(d){d.error?rej(new Error(d.error)):res(d.data);};window.parent.postMessage({type:'art-advance',id:id,data:data},'*');});}};window.fetch=function(u,o){var s=typeof u==='string'?u:(u&&u.href)||'';if(s.indexOf('api.anthropic.com')>=0){return new Promise(function(res,rej){var id=++_i;_p[id]=function(d){d.error?rej(new Error(d.error)):res(new Response(JSON.stringify(d.data),{status:d.status||200,headers:{'content-type':'application/json'}}));};window.parent.postMessage({type:'art-req',id:id,body:o&&o.body},'*');});}return _f.call(this,u,o);};})();<\/script>`;

// postMessage ブリッジ: iframe → hub（source 検証済みホワイトリスト）
// S1: art-req → /api/artifact-llm    S2: art-approve/decline/advance → /api/handoffs/:id/*
window.addEventListener('message', async function(e) {
  const frame = document.getElementById('artifactFrame');
  if (!frame || e.source !== frame.contentWindow) return;   // source 検証（ホワイトリスト）
  const d = e.data; if (!d) return;
  if (d.type === 'art-req') {
    try {
      const r = await fetch('/api/artifact-llm', { method: 'POST', headers: { 'content-type': 'application/json' }, body: d.body });
      frame.contentWindow.postMessage({ type: 'art-res', id: d.id, status: r.status, data: await r.json() }, '*');
    } catch(err) { frame.contentWindow.postMessage({ type: 'art-res', id: d.id, error: err.message }, '*'); }
  } else if (d.type === 'art-approve' || d.type === 'art-decline' || d.type === 'art-advance') {
    if (!_artHandoffId) { frame.contentWindow.postMessage({ type: 'art-flow-res', id: d.id, error: 'no handoff linked' }, '*'); return; }
    const action = d.type === 'art-advance' ? 'result' : d.type === 'art-approve' ? 'approve' : 'decline';
    const body = d.type === 'art-advance' ? JSON.stringify({ result: d.data }) : '{}';
    try {
      const r = await fetch(`/api/handoffs/${_artHandoffId}/${action}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body });
      frame.contentWindow.postMessage({ type: 'art-flow-res', id: d.id, data: await r.json() }, '*');
    } catch(err) { frame.contentWindow.postMessage({ type: 'art-flow-res', id: d.id, error: err.message }, '*'); }
  }
});

<script>(function(){
  var DEST=[
    {label:'玄関',      desc:'ランチャー',           path:'/'},
    {label:'神龍',      desc:'会話でフローを叶える',  path:'/shenron'},
    {label:'キャンバス', desc:'ビジュアルエディタ',    path:'/ui2'},
    {label:'成果物',     desc:'作った道具を操作',      path:'/artifacts'},
    {label:'設定',      desc:'経路・連携・保管庫・通知', path:'/settings'}
  ];
  var here=(location.pathname.replace(/\/+$/,'')||'/');
  var box=document.getElementById('cmdk'),q=document.getElementById('cmdk-q'),list=document.getElementById('cmdk-list'),sel=0,items=DEST.slice();
  function render(){
    var s=(q.value||'').toLowerCase();
    items=DEST.filter(function(d){return !s||d.label.toLowerCase().indexOf(s)>=0||d.desc.toLowerCase().indexOf(s)>=0||d.path.indexOf(s)>=0;});
    if(sel>=items.length)sel=Math.max(0,items.length-1);
    list.innerHTML=items.map(function(d,i){
      var cur=((d.path.replace(/\/+$/,'')||'/')===here);
      return '<div data-i="'+i+'" style="display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;cursor:pointer;font-family:ui-monospace,Menlo,monospace;background:'+(i===sel?'#15324a':'transparent')+'">'
        +'<span style="color:#cfe0ee;font-size:13px;min-width:88px">'+d.label+'</span>'
        +'<span style="color:#6d8aa0;font-size:11px;flex:1">'+d.desc+'</span>'
        +(cur?'<span style="color:#5b9bd1;font-size:10px">現在</span>':'<span style="color:#3f6075;font-size:10px">'+d.path+'</span>')
        +'</div>';
    }).join('')||'<div style="color:#6d8aa0;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace">該当なし</div>';
    [].forEach.call(list.children,function(el){
      if(!el.dataset)return;
      el.onclick=function(){go(items[+el.dataset.i]);};
      el.onmouseenter=function(){sel=+el.dataset.i;paint();};
    });
  }
  function paint(){[].forEach.call(list.children,function(el,i){if(el.style)el.style.background=(i===sel?'#15324a':'transparent');});}
  function go(d){if(d)location.href=d.path;}
  function open(){box.style.display='block';q.value='';sel=0;render();setTimeout(function(){q.focus();},0);}
  function close(){box.style.display='none';}
  document.getElementById('cmdk-open').onclick=open;
  box.onclick=function(e){if(e.target===box)close();};
  q.oninput=render;
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();box.style.display==='block'?close():open();return;}
    if(box.style.display!=='block')return;
    if(e.key==='Escape'){e.preventDefault();close();}
    else if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(items.length-1,sel+1);paint();}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,sel-1);paint();}
    else if(e.key==='Enter'){e.preventDefault();go(items[sel]);}
  });
})();</script>

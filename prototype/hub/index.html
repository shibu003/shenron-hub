<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神龍 — 玄関</title>
<link rel="manifest" href="/manifest.json">
<style>
  /* Netdive Blue（フラット）— docs/THEME.md */
  :root {
    --bg:#0a0c10; --panel:#0c1822; --panel2:#0f1f2c; --line:#213e56; --line-soft:#182d3e;
    --txt:#c2d6e6; --dim:#6d8aa0; --accent:#5b9bd1; --accent-brand:#aacbe4;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt);
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:30px; }
  h1 { margin:0; display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:26px; font-weight:700; letter-spacing:.12em; color:var(--accent-brand); }
  h1 .reticle { width:24px; height:24px; color:var(--accent); }
  h1 span { color:var(--dim); font-weight:400; font-size:14px; letter-spacing:.04em; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; width:100%; max-width:760px; }
  a.card { display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--txt);
           background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:22px 20px;
           transition:border-color .12s, transform .12s, background .12s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-2px); background:var(--panel2); }
  .card .ic { color:var(--accent); height:30px; }
  .card .ic svg { width:30px; height:30px; }
  .card .ti { font-family:var(--mono); font-size:15px; font-weight:600; color:var(--txt); }
  .card .de { font-size:12.5px; color:var(--dim); }
  .foot { font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.02em; }
</style>
</head>
<body>
  <h1>
    <svg class="reticle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    神龍 <span>玄関</span>
  </h1>
  <div class="grid">
    <a class="card" href="/shenron">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 16h-8l-4 3.5V16H4a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 4 5z"/><path d="M7.5 8.8l2.2 2.2-2.2 2.2"/><path d="M12.2 13.2h4.6"/></svg></div>
      <div class="ti">神龍</div>
      <div class="de">会話でフローを叶える（主役）</div>
    </a>
    <a class="card" href="/ui2">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M9 9v11"/></svg></div>
      <div class="ti">キャンバス</div>
      <div class="de">ビジュアルエディタで組み立てる</div>
    </a>
    <a class="card" href="/settings">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v4M4 12v8M12 4v8M12 16v4M20 4v10M20 18v2"/><circle cx="4" cy="10" r="2"/><circle cx="12" cy="14" r="2"/><circle cx="20" cy="16" r="2"/></svg></div>
      <div class="ti">設定</div>
      <div class="de">経路・連携・保管庫・通知</div>
    </a>
    <a class="card" href="/ui-old">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><path d="M10 12h4"/></svg></div>
      <div class="ti">旧 cockpit</div>
      <div class="de">レガシー UI（移行用）</div>
    </a>
  </div>
  <div class="foot">MCP がコントロールプレーン — cockpit はその上の薄い view</div>
</body>
</html>
